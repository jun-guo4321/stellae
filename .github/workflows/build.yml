          import okhttp3.RequestBody.Companion.toRequestBody
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.util.Locale
          import org.vosk.Model
          import org.vosk.Recognizer

          class SpeechManager(private val context: Context) {
              private var speechRecognizer: SpeechRecognizer? = null
              private var textToSpeech: TextToSpeech? = null
              private var mediaPlayer: MediaPlayer? = null
              private var onResultCallback: ((String) -> Unit)? = null
              private var isTtsReady = false
              var enabled = true                 // 语音播报开关（设置里可关闭）
              var speechRate = 10                // 语速（edge-tts rate 百分比）
              var speechPitch = 0                // 音调（edge-tts pitch Hz，-50..50）
              var speechVolume = 0               // 音量（edge-tts volume %，-50..50）
              var asrApiKey = ""                 // 在线语音识别 API Key（百度短语音）
              var asrSecretKey = ""              // 在线语音识别 Secret Key
              private val client = okhttp3.OkHttpClient.Builder()
                  .connectTimeout(10, java.util.concurrent.TimeUnit.SECONDS)
                  .readTimeout(30, java.util.concurrent.TimeUnit.SECONDS)
                  .build()

              init {
                  textToSpeech = TextToSpeech(context) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          textToSpeech?.apply {
                              language = Locale.CHINESE
                              setPitch(1.15f)
                              setSpeechRate(0.92f)
                              isTtsReady = true
                          }
                      }
                  }
              }

              fun startListening(onResult: (String) -> Unit, onError: ((String) -> Unit)? = null) {
                  onResultCallback = onResult
                  if (SpeechRecognizer.isRecognitionAvailable(context)) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(context).apply {
                          setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {}
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {}
                              override fun onError(error: Int) {
                                  val msg = when (error) {
                                      SpeechRecognizer.ERROR_NO_MATCH -> "没有听清，请再说一遍"
                                      SpeechRecognizer.ERROR_NETWORK -> "语音识别需要网络，请检查网络后重试"
                                      SpeechRecognizer.ERROR_SERVER -> "语音识别服务暂时不可用，请稍后再试"
                                      SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> "缺少录音权限"
                                      SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> "说话时间太短，请再试一次"
                                      else -> "语音识别失败（错误码 $error），可能是设备没有语音识别服务"
                                  }
                                  Log.e("Speech", "Error: $error")
                                  onError?.invoke(msg)
                                  onResultCallback?.invoke("")
                              }
                              override fun onResults(results: Bundle?) {
                                  onResultCallback?.invoke(results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: "")
                              }
                              override fun onPartialResults(partialResults: Bundle?) {}
                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })
                      }
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.CHINESE.toString())
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      }
                      speechRecognizer?.startListening(intent)
                  } else if (tryStartVosk(onResult, onError)) {
                      // 系统识别不可用 → 使用 Vosk 离线识别（无 key、离线可用）
                  } else if (asrApiKey.isNotBlank()) {
                      // Vosk 不可用 → 使用在线识别（百度短语音）
                      startOnlineAsr(onResult, onError)
                  } else {
                      onError?.invoke("离线语音识别模型未随 App 打包，请在 GitHub 重新构建最新 APK（v2.7+）后重试")
                      onResultCallback?.invoke("")
                  }
              }

              // ---- Vosk 离线语音识别（无 key）----
              private var voskRecognizer: Recognizer? = null
              private var voskActive = false

              // 把 assets/vosk/model-small-cn 复制到 filesDir/vosk_model，返回模型目录路径
              private fun ensureVoskModelPath(): String {
                  val destDir = java.io.File(context.filesDir, "vosk_model")
                  if (!destDir.exists()) {
                      copyAssetFolder(context.assets, "vosk/model-small-cn", destDir)
                  }
                  return destDir.absolutePath
              }

              private fun copyAssetFolder(am: android.content.res.AssetManager, fromPath: String, toFile: java.io.File) {
                  val list = am.list(fromPath) ?: return
                  if (list.isEmpty()) {
                      // 单个文件
                      try {
                          am.open(fromPath).use { input ->
                              val outFile = java.io.File(toFile, java.io.File(fromPath).name)
                              outFile.parentFile?.mkdirs()
                              java.io.FileOutputStream(outFile).use { output -> input.copyTo(output) }
                          }
                      } catch (e: Exception) {
                          Log.e("Vosk", "copy asset file $fromPath: ${e.message}")
                      }
                  } else {
                      // 目录：递归复制
                      toFile.mkdirs()
                      for (name in list) {
                          val assetPath = "$fromPath/$name"
                          val dest = java.io.File(toFile, name)
                          copyAssetFolder(am, assetPath, dest)
                      }
                  }
              }

              private fun tryStartVosk(onResult: (String) -> Unit, onError: ((String) -> Unit)?): Boolean {
                  return try {
                      voskActive = true
                      // Vosk 需要文件路径：把 assets 里的模型复制到 files 目录再用 Model(String)
                      val modelPath = ensureVoskModelPath()
                      val model = org.vosk.Model(modelPath)
                      voskRecognizer = Recognizer(model, 16000.0f)
                      val sampleRate = 16000
                      val minBuf = android.media.AudioRecord.getMinBufferSize(
                          sampleRate, android.media.AudioFormat.CHANNEL_IN_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT
                      )
                      audioRecord = android.media.AudioRecord(
                          android.media.MediaRecorder.AudioSource.MIC, sampleRate,
                          android.media.AudioFormat.CHANNEL_IN_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT, minBuf * 4
                      )
                      audioRecord?.startRecording()
                      val buf = ByteArray(minBuf)
                      Thread {
                          try {
                              while (voskActive) {
                                  val n = audioRecord?.read(buf, 0, buf.size) ?: -1
                                  if (n > 0) voskRecognizer?.acceptWaveForm(buf, n) else break
                              }
                          } catch (e: Exception) {
                          }
                      }.start()
                      true
                  } catch (e: Exception) {
                      voskActive = false
                      val hint = if (e.message?.contains("model", true) == true) "（离线模型未找到，请确认 APK 内包含 vosk 模型）" else ""
                      onError?.invoke("离线语音识别初始化失败: ${e.message}$hint")
                      false
                  }
              }

              private fun finishVoskAsr() {
                  kotlinx.coroutines.GlobalScope.launch(kotlinx.coroutines.Dispatchers.IO) {
                      try {
                          val raw = voskRecognizer?.finalResult ?: ""
                          voskRecognizer?.close()
                          voskRecognizer = null
                          val text = extractJsonField(raw, "text") ?: ""
                          onResultCallback?.invoke(text)
                      } catch (e: Exception) {
                          onResultCallback?.invoke("")
                      }
                  }
              }

              // ---- 在线语音识别（百度短语音识别 REST）----
              private var audioRecord: android.media.AudioRecord? = null
              private var recordingFile: File? = null
              private var onlineAsrActive = false

              private fun startOnlineAsr(onResult: (String) -> Unit, onError: ((String) -> Unit)?) {
                  onlineAsrActive = true
                  try {
                      val sampleRate = 16000
                      val minBuf = android.media.AudioRecord.getMinBufferSize(
                          sampleRate,
                          android.media.AudioFormat.CHANNEL_IN_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT
                      )
                      val recFile = File(context.cacheDir, "asr_${System.currentTimeMillis()}.pcm")
                      recordingFile = recFile
                      audioRecord = android.media.AudioRecord(
                          android.media.MediaRecorder.AudioSource.MIC, sampleRate,
                          android.media.AudioFormat.CHANNEL_IN_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT, minBuf * 4
                      )
                      audioRecord?.startRecording()
                      val fos = FileOutputStream(recFile)
                      val buf = ByteArray(minBuf)
                      Thread {
                          try {
                              while (onlineAsrActive) {
                                  val n = audioRecord?.read(buf, 0, buf.size) ?: -1
                                  if (n > 0) fos.write(buf, 0, n)
                                  else break
                              }
                          } catch (e: Exception) {
                          } finally {
                              try { fos.close() } catch (_: Exception) {}
                          }
                      }.start()
                  } catch (e: Exception) {
                      onlineAsrActive = false
                      onError?.invoke("录音启动失败: ${e.message}")
                  }
              }

              fun stopListening() {
                  if (voskActive) {
                      voskActive = false
                      try { audioRecord?.stop() } catch (_: Exception) {}
                      audioRecord?.release()
                      audioRecord = null
                      finishVoskAsr()
                      return
                  }
                  if (onlineAsrActive) {
                      onlineAsrActive = false
                      try { audioRecord?.stop() } catch (_: Exception) {}
                      audioRecord?.release()
                      audioRecord = null
                      finishOnlineAsr()
                      return
                  }
                  speechRecognizer?.stopListening()
                  speechRecognizer?.destroy()
                  speechRecognizer = null
              }

              private fun finishOnlineAsr() {
                  kotlinx.coroutines.GlobalScope.launch(kotlinx.coroutines.Dispatchers.IO) {
                      try {
                          val recFile = recordingFile ?: return@launch
                          val audioBytes = recFile.readBytes()
                          recFile.delete()
                          if (audioBytes.isEmpty()) { onResultCallback?.invoke(""); return@launch }
                          val text = recognizeBaidu(audioBytes)
                          onResultCallback?.invoke(text)
                      } catch (e: Exception) {
                          Log.e("OnlineAsr", "fail ${e.message}")
                          onResultCallback?.invoke("")
                      }
                  }
              }

              private suspend fun recognizeBaidu(pcm: ByteArray): String {
                  return withContext(Dispatchers.IO) {
                      try {
                          // 1. 获取 access_token
                          val tokenUrl = "https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${asrApiKey}&client_secret=${asrSecretKey}"
                          val tokenReq = Request.Builder().url(tokenUrl).build()
                          val tokenResp = client.newCall(tokenReq).execute()
                          val tokenJson = tokenResp.body?.string() ?: return@withContext ""
                          tokenResp.close()
                          val token = extractJsonField(tokenJson, "access_token")
                              ?: return@withContext ""
                          // 2. 短语音识别
                          val len = pcm.size
                          val speechB64 = Base64.encodeToString(pcm, Base64.NO_WRAP)
                          val body = "{\"format\":\"pcm\",\"rate\":16000,\"channel\":1,\"cuid\":\"stellae\",\"token\":\"$token\",\"speech\":\"$speechB64\",\"len\":$len}"
                          val req = okhttp3.Request.Builder()
                              .url("https://vop.baidu.com/server_api")
                              .header("Content-Type", "application/json")
                              .post(body.toRequestBody("application/json".toMediaType()))
                              .build()
                          val resp = client.newCall(req).execute()
                          val respStr = resp.body?.string() ?: ""
                          resp.close()
                          // 解析 {"result":["识别文本"]}
                          val resultArr = extractJsonArrayField(respStr, "result")
                          if (resultArr != null) {
                              resultArr
                          } else {
                              // 可能返回 err_msg
                              extractJsonField(respStr, "err_msg") ?: ""
                          }
                      } catch (e: Exception) {
                          Log.e("BaiduAsr", "fail ${e.message}")
                          ""
                      }
                  }
              }

              // 简单 JSON 字段提取（避免正则转义问题）
              private fun extractJsonField(json: String, field: String): String? {
                  val key = "\"$field\""
                  val idx = json.indexOf(key)
                  if (idx < 0) return null
                  val colon = json.indexOf(':', idx)
                  if (colon < 0) return null
                  val q1 = json.indexOf('"', colon + 1)
                  if (q1 < 0) return null
                  val q2 = json.indexOf('"', q1 + 1)
                  if (q2 < 0) return null
                  return json.substring(q1 + 1, q2)
              }
              private fun extractJsonArrayField(json: String, field: String): String? {
                  val key = "\"$field\""
                  val idx = json.indexOf(key)
                  if (idx < 0) return null
                  val bracket = json.indexOf('[', idx)
                  if (bracket < 0) return null
                  val q1 = json.indexOf('"', bracket + 1)
                  if (q1 < 0) return null
                  val q2 = json.indexOf('"', q1 + 1)
                  if (q2 < 0) return null
                  return json.substring(q1 + 1, q2)
              }

              suspend fun speak(text: String, companionName: String = "星黎", voice: String = "zh-CN-XiaoxiaoNeural", rate: Int = 10) {
                  // 加强过滤：移除 Emoji 和所有非文字符号
                  val cleanText = text
                      .replace(Regex("[\\uD83C-\\uDBFF\\uDC00-\\uDFFF]+"), "") // 移除 Emoji
                      .replace(Regex("[^\\u4e00-\\u9fa5a-zA-Z0-9，。、；：！？\"'（）\u2026]"), "") // 保留中英文、数字和常用标点
                      .replace(Regex("\u4efb\u52a1\u5206\u914d:.+"), "")
                      .replace(Regex("\u8bb0\u5fc6\u89e6\u53d1:.+"), "")
                      .trim()

                  if (!enabled) return
                  if (cleanText.isEmpty()) return

                  val success = tryEdgeTts(cleanText, voice, speechRate)
                  if (!success && isTtsReady) {
                      textToSpeech?.apply {
                          setSpeechRate(rate / 100f * 0.92f)
                          speak(cleanText, TextToSpeech.QUEUE_FLUSH, null, null)
                      }
                  }
              }

              suspend fun previewVoice(voice: String, rate: Int = 10, onComplete: (() -> Unit)? = null) {
                  val text = "\u8fd9\u662f\u4e00\u6bb5\u8bd5\u542c\u8bed\u97f3\uff0c\u4f60\u89c9\u5f97\u8fd9\u4e2a\u97f3\u8272\u600e\u4e48\u6837\uff1f"
                  tryEdgeTts(text, voice, speechRate, onComplete)
              }

              private suspend fun tryEdgeTts(text: String, voice: String, rate: Int = 10, onComplete: (() -> Unit)? = null): Boolean {
                  return withContext(Dispatchers.IO) {
                      try {
                          val encodedText = java.net.URLEncoder.encode(text, "UTF-8")
                          val rateParam = if (rate >= 0) "%2B$rate%" else "$rate%"
                          // 音调/音量：edge-tts 参数，按需附加
                          val pitchParam = if (speechPitch != 0) "&pitch=${if (speechPitch >= 0) "%2B${speechPitch}Hz" else "${speechPitch}Hz"}" else ""
                          val volumeParam = if (speechVolume != 0) "&volume=${if (speechVolume >= 0) "%2B${speechVolume}%" else "${speechVolume}%"}" else ""
                          val url = "https://tts.kina.ink/tts?text=$encodedText&voice=$voice&rate=$rateParam$pitchParam$volumeParam"
                          val request = Request.Builder().url(url).build()
                          val response = client.newCall(request).execute()
                          if (!response.isSuccessful) return@withContext false

                          val audioData = response.body?.bytes() ?: return@withContext false
                          val tempFile = File(context.cacheDir, "edge_tts_${System.currentTimeMillis()}.mp3")
                          FileOutputStream(tempFile).use { it.write(audioData) }

                          withContext(Dispatchers.Main) {
                              mediaPlayer?.release()
                              mediaPlayer = MediaPlayer().apply {
                                  setDataSource(tempFile.absolutePath)
                                  prepare()
                                  start()
                                  setOnCompletionListener {
                                      release()
                                      tempFile.delete()
                                      onComplete?.invoke()
                                  }
                              }
                          }
                          true
                      } catch (e: Exception) {
                          Log.e("EdgeTTS", "Failed: ${e.message}")
                          false
                      }
                  }
              }
              fun stopSpeaking() {
                  mediaPlayer?.stop()
                  mediaPlayer?.release()
                  mediaPlayer = null
                  textToSpeech?.stop()
              }

              fun shutdown() {
                  textToSpeech?.shutdown()
                  speechRecognizer?.destroy()
                  mediaPlayer?.release()
              }
          }
          EOF

