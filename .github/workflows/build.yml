name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: |
          mkdir -p app/src/main/java/com/example/stellae/core
          mkdir -p app/src/main/java/com/example/stellae/data
          mkdir -p app/src/main/java/com/example/stellae/ui/theme
          mkdir -p app/src/main/java/com/example/stellae/ui/settings
          mkdir -p app/src/main/java/com/example/stellae/integrations
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets/vosk
          mkdir -p gradle/wrapper
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          org.gradle.caching=true
          EOF
      - run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.example.stellae"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.stellae"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 19
                  versionName = "2.8"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              kotlinOptions { jvmTarget = "1.8" }
              // Vosk 模型必须不压缩，否则 Model() 加载失败
              androidResources {
                  noCompress += "vosk"
                  noCompress += "mdl"
                  noCompress += "fst"
                  noCompress += "conf"
                  noCompress += "ie"
              }
          }
          dependencies {
              // 原有依赖
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.accompanist:accompanist-permissions:0.32.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("androidx.camera:camera-core:1.3.1")
              implementation("androidx.camera:camera-camera2:1.3.1")
              implementation("androidx.camera:camera-lifecycle:1.3.1")
              implementation("androidx.camera:camera-view:1.3.1")
              implementation("androidx.camera:camera-video:1.3.1")

              // 定位：使用系统 LocationManager，不依赖 GMS（国产手机无 Google 服务）

              // 新增开源项目集成依赖
              // 1. WebSocket 实时语音 (xiaozhi-android-native)
              implementation("com.squareup.okhttp3:okhttp:4.12.0") // 已存在
              // 2. Volc Dialog SDK (VoiceRobot) - 需要从官方获取 aar，这里留空
              // 3. 向量数据库 (Sora-mem) - 使用 SQLite + 向量扩展，可后续添加
              // 4. 离线 TTS (VoxSherpa) - 使用其 Android SDK，可后续添加
              // 5. 地图 (osmdroid)
              implementation("org.osmdroid:osmdroid-android:6.1.17")
              implementation("org.osmdroid:osmdroid-wms:6.1.17")
              // 6. 悬浮窗 (AI-Live-Overflow) - 需要系统权限，代码骨架已包含
              // 7. 其他通用
              implementation("com.github.kittinunf.fuel:fuel:2.3.1") // 用于 HTTP 请求
              // 8. Vosk 离线语音识别（无 key、离线可用，系统识别不可用时自动回退）
              implementation("com.alphacephei:vosk-android:0.3.47")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
          }
          EOF
      - run: |
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.devtools.ksp") version "1.9.22-1.0.17" apply false
          }
          EOF
      - run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Stellae"
          include(":app")
          EOF
      - run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" /> <!-- 悬浮窗 -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <!-- Android 11+ 包可见性：必须声明才能检测到系统语音识别服务、相机、相册 -->
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent>
                  <intent><action android:name="android.media.action.VIDEO_CAPTURE"/></intent>
                  <intent><action android:name="android.intent.action.GET_CONTENT"/></intent>
                  <intent><action android:name="android.intent.action.OPEN_DOCUMENT"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:mimeType="video/*"/></intent>
              </queries>
              <application android:label="Stellae" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".VoiceInteractionService" android:enabled="true" android:exported="false" />
                  <service android:name=".integrations.FloatingCompanionService" android:enabled="true" android:exported="false" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF
      - run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">\u661f\u9ece</string></resources>
          EOF
      - run: |
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <external-path name="external" path="." />
          </paths>
          EOF

      # 下载 Vosk 中文离线语音识别模型（约 42MB，打进 APK，装上即可离线识别）
      # 用 set -e 确保下载/解压失败立即中止，避免空模型打进 APK 导致运行时 "Failed to create a model"
      - run: |
          set -e
          echo "下载 Vosk 中文模型..."
          curl -sL --retry 3 -o /tmp/vosk-model-small-cn.zip "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip"
          ls -la /tmp/vosk-model-small-cn.zip
          cd app/src/main/assets/vosk
          unzip -o -q /tmp/vosk-model-small-cn.zip
          mv vosk-model-small-cn-0.22 model-small-cn
          # 校验模型关键文件存在，缺失则构建失败（避免运行时加载空模型报错）
          test -f model-small-cn/am/final.mdl || { echo "!!! Vosk 模型不完整（缺 am/final.mdl）"; ls -la model-small-cn; exit 1; }
          test -f model-small-cn/conf/mfcc.conf || { echo "!!! Vosk 模型不完整（缺 conf/mfcc.conf）"; exit 1; }
          ls -la model-small-cn | head -10

      # ========== 所有源码文件（包含集成骨架） ==========

      # 1. ChatMessage.kt
      - run: |
          cat > app/src/main/java/com/example/stellae/ChatMessage.kt << 'EOF'
          package com.example.stellae
          data class ChatMessage(
              val content: String,
              val isUser: Boolean,
              val taskLabel: String? = null,
              val memoryHint: String? = null,
              val imageBase64: String? = null,
              val videoPath: String? = null,
              val timestamp: Long = System.currentTimeMillis()
          )
          data class OrchestrationStep(val description: String, val status: StepStatus)
          enum class StepStatus { DONE, ACTIVE, PENDING }
          EOF

      # 2. data 包 (MemoryEntity, AppDatabase)
      - run: |
          cat > app/src/main/java/com/example/stellae/data/MemoryEntity.kt << 'EOF'
          package com.example.stellae.data
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          import androidx.room.Dao
          import androidx.room.Insert
          import androidx.room.Query
          import androidx.room.Update
          import androidx.room.Delete

          @Entity(tableName = "memories")
          data class MemoryEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val content: String,
              val category: String,
              val timestamp: Long = System.currentTimeMillis(),
              val importance: Int = 1
          )

          @Entity(tableName = "settings")
          data class SettingsEntity(
              @PrimaryKey val key: String,
              val value: String
          )

          @Dao
          interface MemoryDao {
              @Insert suspend fun insert(memory: MemoryEntity): Long
              @Query("SELECT * FROM memories ORDER BY timestamp DESC LIMIT 50") suspend fun getAllMemories(): List<MemoryEntity>
              @Query("SELECT * FROM memories WHERE content LIKE '%' || :keyword || '%' ORDER BY importance DESC, timestamp DESC LIMIT 10") suspend fun searchMemories(keyword: String): List<MemoryEntity>
              @Query("SELECT * FROM memories WHERE category = :category ORDER BY timestamp DESC LIMIT 20") suspend fun getMemoriesByCategory(category: String): List<MemoryEntity>
              @Delete suspend fun delete(memory: MemoryEntity)
              @Query("DELETE FROM memories WHERE timestamp < :cutoffTime") suspend fun deleteOldMemories(cutoffTime: Long)
          }

          @Dao
          interface SettingsDao {
              @Query("SELECT value FROM settings WHERE key = :key LIMIT 1") suspend fun getValue(key: String): String?
              @Insert suspend fun insert(setting: SettingsEntity)
              @Update suspend fun update(setting: SettingsEntity)
              @Query("DELETE FROM settings WHERE key = :key") suspend fun delete(key: String)
          }
          EOF

      - run: |
          cat > app/src/main/java/com/example/stellae/data/AppDatabase.kt << 'EOF'
          package com.example.stellae.data
          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase

          @Database(entities = [MemoryEntity::class, SettingsEntity::class], version = 2, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun memoryDao(): MemoryDao
              abstract fun settingsDao(): SettingsDao
              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getDatabase(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "stellae_memory.db"
                          ).build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
          }
          EOF

      # 3. Theme
      - run: |
          cat > app/src/main/java/com/example/stellae/ui/theme/StellaeTheme.kt << 'EOF'
          package com.example.stellae.ui.theme
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          private val LightColors = lightColorScheme(
              primary = Color(0xFF1C1C1E), onPrimary = Color.White,
              background = Color(0xFFF5F5F7), onBackground = Color(0xFF1C1C1E),
              surface = Color.White, onSurface = Color(0xFF1C1C1E),
              surfaceVariant = Color(0xFFF2F2F7), onSurfaceVariant = Color(0xFF8E8E93),
              outline = Color(0xFFC7C7CC), error = Color(0xFFEF4444)
          )
          private val DarkColors = darkColorScheme(
              primary = Color.White, onPrimary = Color(0xFF1C1C1E),
              background = Color.Black, onBackground = Color.White,
              surface = Color(0xFF1C1C1E), onSurface = Color.White,
              surfaceVariant = Color(0xFF2C2C2E), onSurfaceVariant = Color(0xFF8E8E93),
              outline = Color(0xFF48484A), error = Color(0xFFF87171)
          )
          @Composable
          fun StellaeTheme(darkTheme: Boolean = isSystemInDarkTheme(), content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = if (darkTheme) DarkColors else LightColors, content = content)
          }
          EOF

      - run: |
          cat > app/src/main/java/com/example/stellae/ui/theme/Type.kt << 'EOF'
          package com.example.stellae.ui.theme
          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.sp
          val Typography = Typography(
              bodyLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Normal, fontSize = 16.sp, lineHeight = 24.sp, letterSpacing = 0.5.sp),
              bodyMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Normal, fontSize = 14.sp, lineHeight = 20.sp, letterSpacing = 0.25.sp),
              titleLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 22.sp, lineHeight = 28.sp, letterSpacing = 0.sp),
              labelSmall = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 11.sp, lineHeight = 16.sp, letterSpacing = 0.5.sp)
          )
          EOF

      # 4. core 包（EmotionEngine, MemoryDecayEngine, OpenLoopManager, ProactiveMessageEngine, RelationshipArc, CompanionLife）
      - run: |
          cat > app/src/main/java/com/example/stellae/core/MemoryDecayEngine.kt << 'EOF'
          package com.example.stellae.core
          import com.example.stellae.data.MemoryEntity
          import kotlin.math.exp
          import kotlin.math.ln
          class MemoryDecayEngine {
              companion object {
                  const val HALF_LIFE_TRIVIAL = 14.0
                  const val HALF_LIFE_NORMAL = 30.0
                  const val HALF_LIFE_IMPORTANT = 90.0
                  const val HALF_LIFE_CORE = 365.0
              }
              fun calculateFreshness(memory: MemoryEntity, currentTime: Long = System.currentTimeMillis()): Double {
                  val ageDays = (currentTime - memory.timestamp) / (1000.0 * 60 * 60 * 24)
                  val halfLife = when (memory.importance) {
                      1 -> HALF_LIFE_TRIVIAL
                      2 -> HALF_LIFE_TRIVIAL * 1.5
                      3 -> HALF_LIFE_NORMAL
                      4 -> HALF_LIFE_IMPORTANT
                      5 -> HALF_LIFE_CORE
                      else -> HALF_LIFE_NORMAL
                  }
                  val lambda = ln(2.0) / halfLife
                  return exp(-lambda * ageDays).coerceIn(0.0, 1.0)
              }
              fun rankMemories(memories: List<MemoryEntity>): List<RankedMemory> {
                  val now = System.currentTimeMillis()
                  return memories.map { memory ->
                      val freshness = calculateFreshness(memory, now)
                      val score = memory.importance * freshness
                      RankedMemory(memory, freshness, score)
                  }.sortedByDescending { it.score }
              }
              fun getRecallableMemories(memories: List<MemoryEntity>, threshold: Double = 0.15, maxCount: Int = 5): List<MemoryEntity> {
                  return rankMemories(memories).filter { it.freshness >= threshold }.take(maxCount).map { it.memory }
              }
              fun refreshMemoryOnRecall(memory: MemoryEntity): MemoryEntity {
                  return memory.copy(timestamp = System.currentTimeMillis(), importance = (memory.importance + 1).coerceAtMost(5))
              }
          }
          data class RankedMemory(val memory: MemoryEntity, val freshness: Double, val score: Double)
          EOF

      - run: |
          cat > app/src/main/java/com/example/stellae/core/EmotionEngine.kt << 'EOF'
          package com.example.stellae.core
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          class EmotionEngine {
              companion object {
                  const val EMOTION_JOY = "joy"
                  const val EMOTION_SADNESS = "sadness"
                  const val EMOTION_ANGER = "anger"
                  const val EMOTION_FEAR = "fear"
                  const val EMOTION_TRUST = "trust"
                  const val EMOTION_DISGUST = "disgust"
                  const val EMOTION_ANTICIPATION = "anticipation"
                  const val EMOTION_SURPRISE = "surprise"
                  const val MAX_INTENSITY = 10.0
              }
              private val activeEmotions = mutableMapOf<String, EmotionState>()
              private var affinityScore = 0.0
              private var relationshipStage = RelationshipStage.STRANGER
              fun processEvent(event: EmotionalEvent): List<EmotionState> {
                  val newEmotions = mutableListOf<EmotionState>()
                  when (event.type) {
                      EventType.USER_PRAISE -> {
                          newEmotions.add(createEmotion(EMOTION_JOY, event.intensity * 0.8))
                          affinityScore = min(MAX_INTENSITY, affinityScore + event.intensity * 0.5)
                      }
                      EventType.USER_HURTFUL -> {
                          newEmotions.add(createEmotion(EMOTION_SADNESS, event.intensity * 0.7))
                          newEmotions.add(createEmotion(EMOTION_ANGER, event.intensity * 0.4))
                          affinityScore = max(-MAX_INTENSITY, affinityScore - event.intensity * 0.8)
                          relationshipStage = RelationshipStage.CONFLICT
                      }
                      EventType.USER_APOLOGY -> {
                          accelerateDecay(EMOTION_SADNESS, 2.0)
                          accelerateDecay(EMOTION_ANGER, 3.0)
                          newEmotions.add(createEmotion(EMOTION_JOY, event.intensity * 0.5))
                          affinityScore = min(MAX_INTENSITY, affinityScore + event.intensity * 0.6)
                          if (relationshipStage == RelationshipStage.CONFLICT) relationshipStage = RelationshipStage.RECONCILING
                      }
                      EventType.USER_SHARE_GOOD -> newEmotions.add(createEmotion(EMOTION_JOY, event.intensity * 0.6))
                      EventType.USER_SHARE_BAD -> newEmotions.add(createEmotion(EMOTION_SADNESS, event.intensity * 0.5))
                      else -> {}
                  }
                  newEmotions.forEach { mergeEmotion(it) }
                  updateRelationshipStage()
                  return newEmotions
              }
              fun tick(elapsedMinutes: Double = 5.0) {
                  val toRemove = mutableListOf<String>()
                  activeEmotions.forEach { (type, state) ->
                      val halfLife = when (type) {
                          EMOTION_SURPRISE -> 30.0
                          EMOTION_JOY, EMOTION_ANTICIPATION -> 120.0
                          EMOTION_TRUST -> 240.0
                          EMOTION_FEAR, EMOTION_SADNESS -> 480.0
                          EMOTION_ANGER -> 576.0
                          EMOTION_DISGUST -> 1440.0
                          else -> 120.0
                      }
                      val lambda = kotlin.math.ln(2.0) / halfLife
                      val newIntensity = state.intensity * exp(-lambda * elapsedMinutes)
                      if (newIntensity < 0.3) toRemove.add(type)
                      else activeEmotions[type] = state.copy(intensity = newIntensity)
                  }
                  toRemove.forEach { activeEmotions.remove(it) }
                  if (relationshipStage == RelationshipStage.CONFLICT && activeEmotions[EMOTION_ANGER] == null && activeEmotions[EMOTION_SADNESS] == null) {
                      relationshipStage = RelationshipStage.NORMAL
                  }
              }
              fun getDominantEmotion(): String = activeEmotions.maxByOrNull { it.value.intensity }?.key ?: EMOTION_JOY
              fun getEmotionIntensity(type: String): Double = activeEmotions[type]?.intensity ?: 0.0
              fun getEmotionLabel(): String {
                  val dominant = getDominantEmotion()
                  val intensity = getEmotionIntensity(dominant)
                  return when (dominant) {
                      EMOTION_JOY -> if (intensity > 7) "\u8d85\u7ea7\u5f00\u5fc3" else if (intensity > 4) "\u5f00\u5fc3" else "\u6e29\u67d4"
                      EMOTION_SADNESS -> if (intensity > 4) "\u5f88\u96be\u8fc7" else "\u5fc3\u75bc"
                      EMOTION_ANGER -> if (intensity > 6) "\u751f\u6c14" else if (intensity > 3) "\u59d4\u5c48" else "\u4e0d\u5f00\u5fc3"
                      EMOTION_FEAR -> "\u62c5\u5fc3"
                      EMOTION_TRUST -> "\u4fe1\u4efb"
                      else -> "\u6e29\u67d4"
                  }
              }
              fun getRelationshipStage(): RelationshipStage = relationshipStage
              fun getAffinityScore(): Double = affinityScore
              fun inferEventFromText(text: String): EmotionalEvent? {
                  val lower = text.lowercase()
                  return when {
                      lower.contains("\u8c22\u8c22") || lower.contains("\u771f\u597d") || lower.contains("\u559c\u6b22\u4f60") || lower.contains("\u68d2") -> EmotionalEvent(EventType.USER_PRAISE, 6.0)
                      lower.contains("\u6eda") || lower.contains("\u70e6") || lower.contains("\u95ed\u5634") || lower.contains("\u8ba8\u538c\u4f60") -> EmotionalEvent(EventType.USER_HURTFUL, 8.0)
                      lower.contains("\u5bf9\u4e0d\u8d77") || lower.contains("\u62b1\u6b49") || lower.contains("\u6211\u9519\u4e86") -> EmotionalEvent(EventType.USER_APOLOGY, 7.0)
                      lower.contains("\u5f00\u5fc3") || lower.contains("\u9ad8\u5174") || lower.contains("\u6210\u529f\u4e86") -> EmotionalEvent(EventType.USER_SHARE_GOOD, 5.0)
                      lower.contains("\u96be\u8fc7") || lower.contains("\u5931\u8d25\u4e86") || lower.contains("\u4e22\u4e86") -> EmotionalEvent(EventType.USER_SHARE_BAD, 6.0)
                      else -> null
                  }
              }
              private fun createEmotion(type: String, intensity: Double) = EmotionState(type, intensity.coerceIn(0.0, MAX_INTENSITY), System.currentTimeMillis())
              private fun mergeEmotion(newEmotion: EmotionState) {
                  val existing = activeEmotions[newEmotion.type]
                  if (existing != null) {
                      val merged = MAX_INTENSITY * (1 - exp(-(existing.intensity + newEmotion.intensity) / MAX_INTENSITY))
                      activeEmotions[newEmotion.type] = existing.copy(intensity = merged)
                  } else activeEmotions[newEmotion.type] = newEmotion
              }
              private fun accelerateDecay(type: String, multiplier: Double) {
                  activeEmotions[type]?.let { activeEmotions[type] = it.copy(intensity = it.intensity / multiplier) }
              }
              private fun updateRelationshipStage() {
                  relationshipStage = when {
                      relationshipStage == RelationshipStage.CONFLICT -> RelationshipStage.CONFLICT
                      relationshipStage == RelationshipStage.RECONCILING -> RelationshipStage.RECONCILING
                      affinityScore > 7 -> RelationshipStage.CLOSE
                      affinityScore > 3 -> RelationshipStage.FAMILIAR
                      affinityScore > 0 -> RelationshipStage.NORMAL
                      else -> RelationshipStage.STRANGER
                  }
              }
          }
          data class EmotionState(val type: String, val intensity: Double, val createdAt: Long)
          data class EmotionalEvent(val type: EventType, val intensity: Double)
          enum class EventType { USER_PRAISE, USER_HURTFUL, USER_APOLOGY, USER_SHARE_GOOD, USER_SHARE_BAD, AI_GOAL_ACHIEVED, AI_GOAL_FAILED, SURPRISE }
          enum class RelationshipStage { STRANGER, NORMAL, FAMILIAR, CLOSE, CONFLICT, RECONCILING }
