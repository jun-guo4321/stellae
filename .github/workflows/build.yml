                      stage == RelationshipStage.RECONCILING -> listOf("...\u597d\u5427\uff0c\u6211\u539f\u8c05\u4f60\u4e86", "\u4e0b\u6b21\u522b\u8fd9\u6837\u4e86\uff0c\u597d\u5417\uff1f", "\u55ef\uff0c\u6211\u77e5\u9053\u4f60\u4e0d\u662f\u6545\u610f\u7684", "...\u62b1\u62b1").random()
                      else -> listOf("\u4f60\u8ba4\u771f\u7684\u5417\uff1f", "\u6211\u4e0d\u77e5\u9053\u8be5\u8bf4\u4ec0\u4e48", "...", "\u55ef").random()
                  }
              }
              fun checkAutoReconcile(): Boolean {
                  val startTime = conflictStartTime ?: return false
                  val elapsedHours = (System.currentTimeMillis() - startTime) / (1000 * 60 * 60)
                  return elapsedHours >= 24
              }
              fun getConflictStatus(): String {
                  val stage = emotionEngine.getRelationshipStage()
                  if (stage != RelationshipStage.CONFLICT && stage != RelationshipStage.RECONCILING) return "\u5173\u7cfb\u6b63\u5e38"
                  val elapsedHours = (System.currentTimeMillis() - (conflictStartTime ?: 0)) / (1000 * 60 * 60)
                  return when {
                      elapsedHours < 1 -> "\u51b2\u7a81\u521d\u671f"
                      elapsedHours < 6 -> "\u51b2\u7a81\u4e2d"
                      elapsedHours < 24 -> "\u51b7\u6218"
                      else -> "\u5373\u5c06\u81ea\u52a8\u548c\u597d"
                  }
              }
              private fun checkSincerity(message: String): Boolean {
                  val lower = message.lowercase()
                  val sincereMarkers = listOf("\u5bf9\u4e0d\u8d77", "\u6211\u9519\u4e86", "\u4e0d\u8be5", "\u4f24\u5bb3", "\u4e0d\u662f\u6545\u610f\u7684", "\u62b1\u6b49")
                  val insincereMarkers = listOf("\u522b\u751f\u6c14\u4e86", "\u81f3\u4e8e\u5417", "\u4e0d\u5c31", "\u884c\u4e86\u884c\u4e86", "\u597d\u4e86\u597d\u4e86")
                  val sincereCount = sincereMarkers.count { lower.contains(it) }
                  val insincereCount = insincereMarkers.count { lower.contains(it) }
                  return sincereCount > insincereCount && sincereCount >= 1
              }
          }
          enum class ApologyResult { ACCEPTED, SOFTENING, REJECTED_NEED_MORE, REJECTED_INSINCERE }
