                              if (!response.isSuccessful) return@withContext "\u62b1\u6b49\uff0c\u6211\u8fd9\u8fb9\u7f51\u7edc\u6709\u70b9\u95ee\u9898\uff0c\u7b49\u4e00\u4e0b\u518d\u804a\u597d\u5417\uff1f"
                              val resp = gson.fromJson(response.body?.string(), ChatCompletionResponse::class.java)
                              resp.choices?.firstOrNull()?.message?.content ?: "\u55ef...\u8ba9\u6211\u60f3\u60f3\u600e\u4e48\u56de\u7b54\u4f60\uff5e"
                          }
                      } catch (e: Exception) {
