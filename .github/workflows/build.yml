                      }
                      // 嘴
                      when (mood) {
                          0 -> drawArc(color = androidx.compose.ui.graphics.Color(0xFFE57373), startAngle = 0f, sweepAngle = 180f, useCenter = false,
                              topLeft = androidx.compose.ui.geometry.Offset(cx - 10f, cy - 2f), size = androidx.compose.ui.geometry.Size(20f, 16f))
                          1 -> drawArc(color = androidx.compose.ui.graphics.Color(0xFFE57373), startAngle = 180f, sweepAngle = 180f, useCenter = false,
