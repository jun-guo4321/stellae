          package com.example.stellae
          import android.content.Context
          import com.example.stellae.data.AppDatabase
          import com.example.stellae.data.MemoryEntity
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          class MemoryManager(context: Context) {
              private val dao = AppDatabase.getDatabase(context).memoryDao()
              suspend fun saveInteraction(userInput: String, aiResponse: String, emotion: String) {
                  withContext(Dispatchers.IO) {
                      extractMemories(userInput, emotion).forEach { dao.insert(it) }
                  }
              }
              suspend fun retrieveRelevantMemories(query: String): List<MemoryEntry> {
                  return withContext(Dispatchers.IO) {
                      val keywords = extractKeywords(query)
                      val results = mutableListOf<MemoryEntity>()
                      keywords.forEach { results.addAll(dao.searchMemories(it)) }
                      results.distinctBy { it.id }.take(5).map { MemoryEntry(it.content, it.category, it.timestamp) }
                  }
              }
              suspend fun retrieveAllMemories(): List<MemoryEntity> {
                  return withContext(Dispatchers.IO) { dao.getAllMemories() }
              }
              suspend fun updateMemory(memory: MemoryEntity) {
                  withContext(Dispatchers.IO) {
                      dao.delete(memory)
                      dao.insert(memory)
                  }
              }
              private fun extractMemories(input: String, emotion: String): List<MemoryEntity> {
                  val memories = mutableListOf<MemoryEntity>()
                  val lower = input.lowercase()
                  if (emotion in listOf("心疼", "关心", "安抚")) {
                      memories.add(MemoryEntity(content = "用户曾表达过情绪困扰，需要温柔对待", category = "emotion", importance = 5))
                  }
                  if (lower.contains("喜欢") || lower.contains("爱")) {
                      val thing = extractPreference(input)
                      if (thing.isNotEmpty()) memories.add(MemoryEntity(content = "用户喜欢: $thing", category = "preference", importance = 3))
                  }
                  if (lower.contains("生日") || lower.contains("考试") || lower.contains("面试")) {
                      memories.add(MemoryEntity(content = "用户提及: ${input.take(50)}", category = "event", importance = 4))
                  }
                  return memories
              }
              private fun extractKeywords(query: String): List<String> {
                  val stopWords = setOf("的", "了", "是", "我", "你", "吗", "呢", "吧", "啊", "今天", "明天")
                  return query.split(" ", "，", "。", "？", "！").flatMap { it.toList().map { c -> c.toString() } }.filter { it !in stopWords }.distinct().take(5)
              }
              private fun extractPreference(input: String): String {
                  listOf("喜欢(.+?)[，。]", "爱(.+?)[，。]", "最爱(.+?)[，。]").forEach { pattern ->
                      Regex(pattern).find(input)?.let { return it.groupValues[1] }
                  }
                  return ""
              }
          }
          data class MemoryEntry(val content: String, val category: String, val timestamp: Long)
