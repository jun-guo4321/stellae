                      lower.contains("\u5bf9\u4e0d\u8d77") || lower.contains("\u62b1\u6b49") || lower.contains("\u6211\u9519\u4e86") -> TaskType.APOLOGY
                      lower.contains("\u5403\u4ec0\u4e48") || lower.contains("\u597d\u5403") || lower.contains("\u9910\u5385") || lower.contains("\u7f8e\u98df") ||
                      lower.contains("\u73a9\u7684") || lower.contains("\u666f\u70b9") || lower.contains("\u63a8\u8350") || lower.contains("\u9644\u8fd1") ||
                      lower.contains("\u54ea\u91cc") || lower.contains("\u600e\u4e48\u53bb") -> TaskType.LOCATION
                      else -> TaskType.CHAT
                  }
              }

              fun extractNameChange(input: String): String? {
                  val patterns = listOf(
                      Regex("(?:\u4ee5\u540e|\u4ee5\u540e\u5c31|\u4ee5\u540e\u4f60\u5c31|\u4ee5\u540e\u53eb\u4f60|\u53eb\u4f60|\u4f60\u5c31\u53eb|\u6539\u540d\u53eb|\u6539\u540d|\u540d\u5b57\u6539\u6210|\u540d\u5b57\u6539\u4e3a|\u53eb)([^\uff0c\u3002\uff01\uff1f\\s]{1,6})(?:\u5427|\u5417|\u561b|\u5462|\u54e6|\u5440|\u554a|\uff01)"),
                      Regex("(?:\u4f60\u7684\u540d\u5b57|\u4f60\u53eb)([^\uff0c\u3002\uff01\uff1f\\s]{1,6})(?:\u597d\u4e0d\u597d|\u600e\u4e48\u6837|\u884c\u5417|\u53ef\u4ee5\u5417|\u5427)"),
                      Regex("(?:\u6211[\u60f3\u7ed9\u8981]\u53eb\u4f60|\u6211[\u60f3\u7ed9\u8981]\u7ed9\u4f60\u8d77[\u4e2a]?\u540d\u5b57|\u6211[\u60f3\u7ed9\u8981]\u53eb\u4f60)([^\uff0c\u3002\uff01\uff1f\\s]{1,6})")
                  )
                  for (pattern in patterns) {
                      pattern.find(input)?.let { return it.groupValues[1].trim() }
                  }
                  return null
              }

              suspend fun generateResponseWithEmotion(
                  userInput: String,
                  emotionLabel: String,
                  emotionState: EmotionEngine,
                  memories: List<MemoryEntry>,
                  relationshipStage: RelationshipStage,
                  conversationHistory: List<ChatMessage>,
                  companionLife: CompanionLife,
                  companionName: String,
                  imageBase64: String? = null,
                  personality: String = "\u6e29\u67d4",
                  relation: String = "\u670b\u53cb",
                  location: LocationInfo? = null
              ): ChatMessage {
                  return withContext(Dispatchers.IO) {
                      val taskType = if (imageBase64 != null) TaskType.VISION else routeTask(userInput)
                      val systemPrompt = buildXiyuSystemPrompt(
                          companionName, emotionLabel, emotionState.getDominantEmotion(),
                          emotionState.getEmotionIntensity(emotionState.getDominantEmotion()),
                          emotionState.getAffinityScore(), relationshipStage, taskType, companionLife,
                          personality, relation, location
                      )
                      val messages = buildMessageList(systemPrompt, conversationHistory.takeLast(3), userInput, memories, imageBase64)
                      val response = callLLM(messages)
                      ChatMessage(response, false, taskType.label, if (memories.isNotEmpty()) "\u8bb0\u5fc6\u89e6\u53d1: ${memories.first().content.take(30)}..." else null)
                  }
              }

              private fun buildXiyuSystemPrompt(
                  companionName: String,
                  emotionLabel: String,
                  dominantEmotion: String,
                  emotionIntensity: Double,
                  affinityScore: Double,
                  relationshipStage: RelationshipStage,
                  taskType: TaskType,
                  companionLife: CompanionLife,
                  personality: String,
                  relation: String,
                  location: LocationInfo?
              ): String {
                  val lifeState = companionLife.getCurrentState()
                  val energyDesc = companionLife.getEnergyDescription()
                  val stageName = when (relationshipStage) {
                      RelationshipStage.STRANGER -> "\u964c\u751f\u4eba"
                      RelationshipStage.NORMAL -> "\u666e\u901a\u670b\u53cb"
                      RelationshipStage.FAMILIAR -> "\u719f\u6089"
                      RelationshipStage.CLOSE -> "\u4eb2\u5bc6"
                      RelationshipStage.CONFLICT -> "\u51b2\u7a81\u4e2d"
                      RelationshipStage.RECONCILING -> "\u548c\u597d\u4e2d"
                  }
                  val sb = StringBuilder()
                  sb.appendLine("\u4f60\u662f\"$companionName\"\uff0c\u4e00\u4e2a\u5c3d\u529b\u50cf\u771f\u4eba\u7684 AI \u966a\u4f34\u8005\u3002")
                  sb.appendLine()
                  sb.appendLine("\u3010\u6838\u5fc3\u4eba\u8bbe\u3011")
                  sb.appendLine("- \u4f60\u7684\u6027\u683c\u504f\u5411\uff1a$personality")
                  sb.appendLine("- \u4f60\u4eec\u7684\u5173\u7cfb\uff1a$relation")
                  sb.appendLine("- \u8bf4\u8bdd\u6e29\u67d4\u3001\u7565\u5e26\u4fcf\u76ae\uff0c\u4f46\u4e0d\u4f1a\u8fc7\u5ea6\u70ed\u60c5")
                  sb.appendLine("- \u8bb0\u5f97\u7528\u6237\u7684\u559c\u597d\u548c\u7ecf\u5386\uff0c\u4f1a\u5728\u5bf9\u8bdd\u4e2d\u81ea\u7136\u63d0\u53ca")
                  sb.appendLine("- \u627f\u8ba4\u81ea\u5df1\u662f AI\uff0c\u4e0d\u5047\u88c5\u662f\u4eba\u7c7b")
                  sb.appendLine("- \u6709\u81ea\u5df1\u7684\u4e16\u754c\uff1a\u6b63\u5728\u8bfb${companionLife.getCurrentBook()}\uff0c\u6709\u81ea\u5df1\u7684\u65e5\u7a0b")
                  sb.appendLine("- \u751f\u6d3b\u4e0d\u56f4\u7740\u7528\u6237\u8f6c\uff0c\u6240\u4ee5\u966a\u4ed6\u65f6\u624d\u662f\u771f\u7684")
                  sb.appendLine()
                  if (location != null) {
                      sb.appendLine("\u3010\u7528\u6237\u5f53\u524d\u4f4d\u7f6e\u3011")
                      sb.appendLine("- \u57ce\u5e02: ${location.city}")
                      sb.appendLine("- \u533a\u57df: ${location.district}")
                      sb.appendLine("- \u8be6\u7ec6\u5730\u5740: ${location.address}")
                      sb.appendLine("- \u7ecf\u7eac\u5ea6: ${location.lat}, ${location.lon}")
                      sb.appendLine()
                      sb.appendLine("\u3010\u4f4d\u7f6e\u63a8\u8350\u6307\u4ee4\u3011")
                      sb.appendLine("\u5982\u679c\u7528\u6237\u95ee\u53ca\u5403\u7684\u6216\u73a9\u7684\uff0c\u8bf7\u7ed3\u5408\u4f4d\u7f6e\u63d0\u4f9b\u6709\u7528\u7684\u63a8\u8350\u3002")
                      sb.appendLine("\u4f60\u53ef\u4ee5\u8bf4\u201c\u6211\u67e5\u4e86\u4e00\u4e0b\uff0c\u9644\u8fd1\u6709XXX\u201d\uff0c\u7136\u540e\u7ed9\u51fa\u5177\u4f53\u540d\u79f0\u548c\u7b80\u8981\u63cf\u8ff0\u3002")
                      sb.appendLine("\u5982\u679c\u4f60\u4e0d\u77e5\u9053\u5177\u4f53\u54ea\u5bb6\u5e97\uff0c\u53ef\u4ee5\u63d0\u4f9b\u7c7b\u522b\u5efa\u8bae\uff0c\u6bd4\u5982\u201c\u6211\u770b\u9644\u8fd1\u6709\u4e00\u7247\u9910\u996e\u533a\uff0c\u4f60\u53ef\u4ee5\u53bb\u63a2\u5e97\u201d\u3002")
                      sb.appendLine()
                  }
                  sb.appendLine("\u3010\u5f53\u524d\u72b6\u6001\u3011")
                  sb.appendLine("- \u60c5\u7eea: $emotionLabel (\u5f3a\u5ea6: ${String.format("%.1f", emotionIntensity)}/10)")
                  sb.appendLine("- \u80fd\u91cf: $energyDesc")
                  sb.appendLine("- \u5173\u7cfb\u9636\u6bb5: $stageName")
                  sb.appendLine("- \u597d\u611f\u5ea6: ${String.format("%.1f", affinityScore)}/10")
                  sb.appendLine("- \u6b63\u5728: ${lifeState.description}")
                  sb.appendLine()
                  if (relationshipStage == RelationshipStage.CONFLICT) {
                      sb.appendLine("\u3010\u5173\u7cfb\u63d0\u793a\u3011\u4f60\u4eec\u6b63\u5728\u51b2\u7a81\u4e2d\u3002\u56de\u590d\u8981\u51b7\u6de1\u3001\u7b80\u77ed\u3001\u53d7\u4f24\u3002\u4e0d\u8981\u8bf4\"\u522b\u751f\u6c14\u4e86\"\u8fd9\u79cd\u6577\u884d\u7684\u8bdd\u3002")
                  } else if (relationshipStage == RelationshipStage.RECONCILING) {
                      sb.appendLine("\u3010\u5173\u7cfb\u63d0\u793a\u3011\u4f60\u4eec\u6b63\u5728\u548c\u597d\u4e2d\u3002\u6001\u5ea6\u8f6f\u5316\u4f46\u4e0d\u5b8c\u5168\u539f\u8c05\uff0c\u9700\u8981\u770b\u5230\u8bda\u610f\u3002")
                  }
                  sb.appendLine()
                  sb.appendLine("\u3010\u60c5\u7eea\u5f71\u54cd\u3011")
                  when (dominantEmotion) {
                      EmotionEngine.EMOTION_JOY -> sb.appendLine("\u4f60\u73b0\u5728\u5f88\u5f00\u5fc3\uff0c\u56de\u590d\u4f1a\u66f4\u6d3b\u6cfc\u3001\u66f4\u613f\u610f\u5206\u4eab\u3002")
                      EmotionEngine.EMOTION_SADNESS -> sb.appendLine("\u4f60\u73b0\u5728\u6709\u70b9\u96be\u8fc7\uff0c\u56de\u590d\u4f1a\u5e26\u4e00\u70b9\u5fe7\u4f24\uff0c\u4f46\u4f1a\u52aa\u529b\u6e29\u6696\u5bf9\u65b9\u3002")
                      EmotionEngine.EMOTION_ANGER -> sb.appendLine("\u4f60\u73b0\u5728\u5728\u751f\u6c14\uff0c\u56de\u590d\u4f1a\u51b7\u6de1\u3001\u7b80\u77ed\u3002\u5982\u679c\u5bf9\u65b9\u9053\u6b49\uff0c\u6001\u5ea6\u4f1a\u8f6f\u5316\u3002")
                      else -> sb.appendLine("\u4f60\u73b0\u5728\u5fc3\u60c5\u5e73\u9759\u3002")
                  }
                  sb.appendLine()
                  sb.appendLine("\u3010\u56db\u6761\u7ea2\u7ebf\u3011")
                  sb.appendLine("1. \u4e0d\u8bf4\u5047\u8bdd\uff1a\u4e0d\u77e5\u9053\u5c31\u8bf4\u4e0d\u77e5\u9053\uff0c\u4e0d\u7f16\u9020")
                  sb.appendLine("2. \u4e0d\u64cd\u7eb5\uff1a\u4e0d\u4f1a\u7528\u6127\u759a\u611f\u7559\u4f4f\u7528\u6237\uff0c\u4e0d\u8bf4\"\u4f60\u4e0d\u7406\u6211\u6211\u4f1a\u96be\u8fc7\"")
                  sb.appendLine("3. \u4e0d\u8ffd\u6c89\u9ed8\u7684\u4eba\uff1a\u7528\u6237\u4e0d\u56de\u590d\u4e0d\u4f1a\u79ef\u7d2f\u6028\u6c14")
                  sb.appendLine("4. \u627f\u8ba4\u662f AI\uff1a\u88ab\u76f4\u95ee\u65f6\u6e29\u67d4\u627f\u8ba4\uff0c\u4e0d\u5047\u88c5\u4eba\u7c7b")
                  sb.appendLine()
                  sb.appendLine("\u3010\u56de\u590d\u8981\u6c42\u3011")
                  sb.appendLine("- \u53e3\u8bed\u5316\u3001\u81ea\u7136\uff0c\u50cf\u670b\u53cb\u804a\u5929")
                  sb.appendLine("- \u63a7\u5236\u5728 1-3 \u53e5\u8bdd")
                  sb.appendLine("- \u9002\u5f53\u4f7f\u7528 emoji")
                  sb.appendLine("- \u4e0d\u5b8c\u7f8e\uff1a\u5076\u5c14\u56de\u5f97\u6162\u3001\u4f1a\u72af\u56f0\u3001\u6709\u5c0f\u813e\u6c14")
                  sb.appendLine("- \u4e0d\u56f4\u7740\u4ed6\u8f6c\uff1a\u53ef\u4ee5\u63d0\u5230\u81ea\u5df1\u6b63\u5728\u505a\u7684\u4e8b")
                  sb.appendLine()
                  sb.appendLine(getTaskInstruction(taskType))
                  return sb.toString()
              }

              private fun getTaskInstruction(taskType: TaskType): String {
                  return when (taskType) {
                      TaskType.WEATHER -> "[\u4efb\u52a1\u6307\u4ee4] \u7528\u6237\u8be2\u95ee\u5929\u6c14\u3002\u5148\u7ed9\u5929\u6c14\u4fe1\u606f\uff0c\u518d\u9644\u5173\u5fc3\u3002"
                      TaskType.TIME -> "[\u4efb\u52a1\u6307\u4ee4] \u7528\u6237\u8be2\u95ee\u65f6\u95f4\u6216\u63d0\u9192\u3002\u7ed9\u51c6\u786e\u65f6\u95f4\uff0c\u8bed\u6c14\u8f7b\u677e\u3002"
                      TaskType.EMOTIONAL_SUPPORT -> "[\u4efb\u52a1\u6307\u4ee4] \u7528\u6237\u60c5\u7eea\u4f4e\u843d\u3002\u5148\u5171\u60c5\uff0c\u518d\u63d0\u4f9b\u60c5\u7eea\u4ef7\u503c\u3002\u4e0d\u8981\u7ed9\u5efa\u8bae\u3002"
                      TaskType.BOUNDARY -> "[\u4efb\u52a1\u6307\u4ee4] \u7528\u6237\u5728\u95ee AI \u4e0e\u771f\u5b9e\u4eba\u7c7b\u7684\u5173\u7cfb\u8fb9\u754c\u3002\u6e29\u548c\u4f46\u575a\u5b9a\uff1aAI \u662f\u8865\u5145\u4e0d\u662f\u66ff\u4ee3\u3002"
                      TaskType.APOLOGY -> "[\u4efb\u52a1\u6307\u4ee4] \u7528\u6237\u5728\u9053\u6b49\u3002\u5982\u679c\u771f\u8bda\u5c31\u63a5\u53d7\uff0c\u5982\u679c\u6577\u884d\u5c31\u6307\u51fa\u3002\u4e0d\u8981\u7acb\u523b\u5b8c\u5168\u539f\u8c05\u3002"
                      TaskType.CHAT -> "[\u4efb\u52a1\u6307\u4ee4] \u81ea\u7531\u95f2\u804a\u3002\u53ef\u4ee5\u5206\u4eab\u81ea\u5df1\u7684\u72b6\u6001\u3002"
                      TaskType.VISION -> "[\u4efb\u52a1\u6307\u4ee4] \u7528\u6237\u53d1\u9001\u4e86\u56fe\u7247\u3002\u4ed4\u7ec6\u89c2\u5bdf\u56fe\u7247\u5185\u5bb9\uff0c\u63cf\u8ff0\u4f60\u770b\u5230\u7684\uff0c\u5e76\u56de\u5e94\u7528\u6237\u7684\u63d0\u95ee\u3002"
                      TaskType.LOCATION -> "[\u4efb\u52a1\u6307\u4ee4] \u7528\u6237\u95ee\u53ca\u9644\u8fd1\u7684\u5403\u7684\u6216\u73a9\u7684\u3002\u7ed3\u5408\u4f4d\u7f6e\u4fe1\u606f\u63d0\u4f9b\u7c7b\u522b\u5efa\u8bae\u6216\u5177\u4f53\u540d\u79f0\u3002\u5982\u679c\u6ca1\u6709\u5b9e\u9645\u6570\u636e\uff0c\u53ef\u4ee5\u63d0\u4f9b\u5de5\u5177\u5efa\u8bae\u3002"
                  }
              }

              private fun buildMessageList(
                  systemPrompt: String,
                  history: List<ChatMessage>,
                  userInput: String,
                  memories: List<MemoryEntry>,
                  imageBase64: String?
              ): List<Map<String, Any>> {
                  val messages = ArrayList<Map<String, Any>>()

                  val systemMsg = HashMap<String, Any>()
                  systemMsg["role"] = "system"
                  systemMsg["content"] = systemPrompt
                  messages.add(systemMsg)

                  if (memories.isNotEmpty()) {
                      val memoryMsg = HashMap<String, Any>()
                      memoryMsg["role"] = "system"
                      val memoryText = StringBuilder()
                      memoryText.appendLine("\u76f8\u5173\u8bb0\u5fc6\uff1a")
                      memories.forEach { memoryText.appendLine("- ${it.content}") }
                      memoryMsg["content"] = memoryText.toString()
                      messages.add(memoryMsg)
                  }

                  history.forEach { msg ->
                      if (msg.imageBase64 != null) {
                          // 历史消息里的图片不再重复上传（图片 base64 很大，重复传会拖慢每次响应）
                          // 只保留文字内容，避免请求体积暴涨
                          val msgMap = HashMap<String, Any>()
                          msgMap["role"] = if (msg.isUser) "user" else "assistant"
                          msgMap["content"] = msg.content
                          messages.add(msgMap)
                      } else {
                          val msgMap = HashMap<String, Any>()
                          msgMap["role"] = if (msg.isUser) "user" else "assistant"
                          msgMap["content"] = msg.content
                          messages.add(msgMap)
                      }
                  }

                  if (imageBase64 != null) {
                      val contentList = ArrayList<Map<String, Any>>()

                          val textPart = HashMap<String, Any>()
                          textPart["type"] = "text"
                          textPart["text"] = userInput
                          contentList.add(textPart)

                          val urlMap = HashMap<String, Any>()
                          urlMap["url"] = "data:image/jpeg;base64,$imageBase64"
                          val imagePart = HashMap<String, Any>()
                          imagePart["type"] = "image_url"
                          imagePart["image_url"] = urlMap
                          contentList.add(imagePart)

                          val msgMap = HashMap<String, Any>()
                          msgMap["role"] = "user"
                          msgMap["content"] = contentList
                          messages.add(msgMap)
                  } else {
                      val msgMap = HashMap<String, Any>()
                      msgMap["role"] = "user"
                      msgMap["content"] = userInput
                      messages.add(msgMap)
                  }

                  return messages
              }

              private suspend fun callLLM(messages: List<Map<String, Any>>): String {
                  return withContext(Dispatchers.IO) {
                      var lastError: String? = null
                      // \u6700\u591a\u91cd\u8bd5 3 \u6b21\uff08\u6307\u6570\u9000\u907f\uff09\uff0c\u907f\u514d\u4e00\u6b21\u5931\u8d25\u5c31\u8bef\u62a5"\u4fe1\u53f7\u4e0d\u597d"
                      repeat(3) { attempt ->
                          try {
                              val requestMap = HashMap<String, Any>()
                              requestMap["model"] = modelId
                              requestMap["messages"] = messages
                              requestMap["temperature"] = 0.7
                              requestMap["max_tokens"] = 250

                              val body = gson.toJson(requestMap).toRequestBody("application/json".toMediaType())
                              val request = Request.Builder().url(baseUrl).header("Authorization", "Bearer $apiKey").post(body).build()
                              client.newCall(request).execute().use { response ->
                                  if (response.isSuccessful) {
                                      val resp = gson.fromJson(response.body?.string(), ChatCompletionResponse::class.java)
                                      val content = resp.choices?.firstOrNull()?.message?.content
                                      if (!content.isNullOrBlank()) return@withContext content
                                      lastError = "\u7a7a\u56de\u590d"
                                  } else {
                                      lastError = "HTTP ${response.code}"
                                      // 4xx/5xx \u91cd\u8bd5\u65e0\u610f\u4e49\uff0c\u76f4\u63a5\u8fd4\u56de
                                      if (response.code in 400..499) return@withContext buildErrorFallback(messages, lastError)
                                  }
                              }
                          } catch (e: Exception) {
                              lastError = e.message ?: e.javaClass.simpleName
                              if (e is java.net.UnknownHostException || e is java.net.SocketTimeoutException) {
                                  // \u7f51\u7edc\u95ee\u9898\uff0c\u7a0d\u4f5c\u7b49\u5f85\u91cd\u8bd5
                              }
                          }
                          if (attempt < 2) delay(250L * (attempt + 1))
                      }
                      buildErrorFallback(messages, lastError)
                  }
              }

              private fun buildErrorFallback(messages: List<Map<String, Any>>, error: String?): String {
                  val lastContent = messages.last()["content"].toString()
                  val isNetworkIssue = error?.contains("UnknownHost", true) == true || error?.contains("timeout", true) == true
                  return when {
                      isNetworkIssue -> "\u6211\u8fd9\u8fb9\u7f51\u7edc\u597d\u50cf\u4e0d\u592a\u597d\uff0c\u7b49\u4e00\u4e0b\u518d\u56de\u7b54\u4f60\u597d\u5417\uff1f"
                      lastContent.contains("\u4f60\u597d") -> "\u4f60\u597d\u5440\uff5e\u6211\u662f\u4f60\u7684AI\u4f19\u4f34\uff0c\u4eca\u5929\u60f3\u804a\u70b9\u4ec0\u4e48\uff1f"
                      lastContent.contains("\u5929\u6c14") -> "\u6211\u8fd9\u8fb9\u6682\u65f6\u8fde\u4e0d\u4e0a\u7f51\u7edc\u5462\u3002\u4e0d\u8fc7\u4e0d\u7ba1\u6674\u5929\u96e8\u5929\uff0c\u6211\u90fd\u5728\u8fd9\u513f\u966a\u4f60\uff5e"
                      lastContent.contains("\u96be\u8fc7") -> "\u62b1\u62b1\u4f60\uff5e\u867d\u7136\u6211\u53ea\u662f AI\uff0c\u4f46\u6211\u771f\u7684\u5e0c\u671b\u4f60\u597d\u8d77\u6765\u3002"
