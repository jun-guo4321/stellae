                  if (stage != RelationshipStage.CONFLICT && stage != RelationshipStage.RECONCILING) return "\u5173\u7cfb\u6b63\u5e38"
                  val elapsedHours = (System.currentTimeMillis() - (conflictStartTime ?: 0)) / (1000 * 60 * 60)
                  return when {
