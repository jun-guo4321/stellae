                  TimeSlot(21, 23, ActivityType.RELAXING, "在发呆"),
                  TimeSlot(23, 6, ActivityType.SLEEPING, "已经睡了")
              )
              fun getCurrentState(): LifeState {
                  val hour = java.util.Calendar.getInstance().get(java.util.Calendar.HOUR_OF_DAY)
                  val slot = schedule.find { hour in it.startHour until it.endHour } ?: schedule.first()
                  if (slot.activity == ActivityType.SLEEPING && Random.nextDouble() > 0.3) {
                      return LifeState(slot.activity, "我已经睡了，明天再聊吧～", false, 0.1)
                  }
                  return LifeState(slot.activity, slot.description, true, energyLevel)
              }
              fun getCurrentBook(): String = currentBook
              fun getLifeShare(): String? {
                  val state = getCurrentState()
                  if (!state.available) return null
                  return when (state.activity) {
