      # 16. MapLocationManager（基于 osmdroid）
      - run: |
          cat > app/src/main/java/com/example/stellae/integrations/MapLocationManager.kt << 'EOF'
          package com.example.stellae.integrations

          import android.content.Context
          import org.osmdroid.config.Configuration
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.views.MapView

          /**
           * 地图定位管理（osmdroid）
           * 参考: https://github.com/osmdroid/osmdroid
           */
          class MapLocationManager(private val context: Context) {
              init {
                  Configuration.getInstance().load(context, context.getSharedPreferences("osmdroid", Context.MODE_PRIVATE))
              }

              fun createMapView(): MapView = MapView(context).apply {
                  setBuiltInZoomControls(true)
                  setMultiTouchControls(true)
              }

              fun moveToLocation(mapView: MapView, lat: Double, lon: Double) {
                  mapView.controller.setCenter(GeoPoint(lat, lon))
                  mapView.controller.setZoom(15.0)
              }
          }
          EOF

