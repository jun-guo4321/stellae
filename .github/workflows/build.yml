          package com.example.stellae
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.util.Log
          import java.util.Locale
          class SpeechManager(private val context: Context) {
              private var speechRecognizer: SpeechRecognizer? = null
              private var textToSpeech: TextToSpeech? = null
              private var onResultCallback: ((String) -> Unit)? = null
              private var isTtsReady = false
              init {
                  textToSpeech = TextToSpeech(context) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          textToSpeech?.apply {
                              language = Locale.CHINESE
                              setPitch(1.15f)      // 音调稍高，更温柔
                              setSpeechRate(0.92f) // 语速稍慢，更自然
                              isTtsReady = true
                          }
                      }
                  }
              }
              fun startListening(onResult: (String) -> Unit) {
                  onResultCallback = onResult
                  if (SpeechRecognizer.isRecognitionAvailable(context)) {
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(context).apply {
                          setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {}
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {}
                              override fun onError(error: Int) { onResultCallback?.invoke(""); Log.e("Speech", "Error: $error") }
                              override fun onResults(results: Bundle?) {
                                  onResultCallback?.invoke(results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: "")
                              }
                              override fun onPartialResults(partialResults: Bundle?) {}
                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })
                      }
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.CHINESE.toString())
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      }
                      speechRecognizer?.startListening(intent)
                  } else {
                      onResultCallback?.invoke("")
                  }
              }
              fun stopListening() {
                  speechRecognizer?.stopListening()
                  speechRecognizer?.destroy()
                  speechRecognizer = null
              }
              fun speak(text: String) {
                  if (!isTtsReady) return
                  // 过滤所有emoji和特殊符号
                  val cleanText = text
                      .replace(Regex("[\uD83C-\uD83E][\uDC00-\uDFFF]|[\u2600-\u27BF]|[\uFE00-\uFE0F]"), "") // 过滤emoji
                      .replace(Regex("[🧠🌤️⏰💝🛡️💭✓○●😴🔄💔😂🤣😊😉😍🥰😘😗😙😚😋😛😜🤪😝🤑🤗🤭🤫🤔🤐🤨😐😑😶😏😒🙄😬🤥😌😔😪🤤😴😷🤒🤕🤢🤮🤧🥵🥶🥴😵🤯🤠🥳😎🤓🧐😕😟🙁☹️😮😯😲😳🥺😦😧😨😰😥😢😭😱😖😣😞😓😩😫🥱😤😡😠🤬😈👿💀☠️💩🤡👹👺👻👽👾🤖😺😸😹😻😼😽🙀😿😾❤️🧡💛💚💙💜🖤🤍🤎💔❣️💕💞💓💗💖💘💝]"), "")
                      .replace(Regex("任务分配:.+"), "")
                      .replace(Regex("记忆触发:.+"), "")
                      .trim()
                  if (cleanText.isNotEmpty()) {
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
                          // 优化音色：更自然的音调和语速
                          val utteranceId = "utterance_" + System.currentTimeMillis()
                          textToSpeech?.speak(cleanText, TextToSpeech.QUEUE_FLUSH, null, utteranceId)
                      } else {
                          @Suppress("DEPRECATION")
                          textToSpeech?.speak(cleanText, TextToSpeech.QUEUE_FLUSH, null)
                      }
                  }
              }
              fun stopSpeaking() { textToSpeech?.stop() }
              fun shutdown() { textToSpeech?.shutdown(); speechRecognizer?.destroy() }
          }
