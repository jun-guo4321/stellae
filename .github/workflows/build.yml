          import com.google.accompanist.permissions.rememberPermissionState
          import com.example.stellae.ui.settings.SettingsScreen
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { ChatScreen() }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class, ExperimentalPermissionsApi::class)
          @Composable
          fun ChatScreen(viewModel: ChatViewModel = viewModel()) {
              val messages by viewModel.messages.collectAsState()
              val isRecording by viewModel.isRecording.collectAsState()
              val isProcessing by viewModel.isProcessing.collectAsState()
              val isInVoiceCall by viewModel.isInVoiceCall.collectAsState()
              val currentEmotion by viewModel.currentEmotion.collectAsState()
              val relationshipStage by viewModel.relationshipStage.collectAsState()
              val companionName by viewModel.companionName.collectAsState()
              val companionStatus by viewModel.companionStatus.collectAsState()
              val avatarImage by viewModel.avatarImage.collectAsState()
              val listState = rememberLazyListState()
              var inputText by remember { mutableStateOf("") }
              val scope = rememberCoroutineScope()
              var showSettings by remember { mutableStateOf(false) }
              val context = androidx.compose.ui.platform.LocalContext.current
              var showMorePanel by remember { mutableStateOf(false) }
              var avatarEnabled by remember { mutableStateOf(viewModel.getAvatarEnabled()) }

              val recordAudioPermissionState = rememberPermissionState(Manifest.permission.RECORD_AUDIO)
              val cameraPermissionState = rememberPermissionState(Manifest.permission.CAMERA)
              val locationPermissionState = rememberPermissionState(Manifest.permission.ACCESS_FINE_LOCATION)

              // 打开应用自动申请定位 + 相机 + 录音权限
              LaunchedEffect(Unit) {
                  if (!locationPermissionState.status.isGranted) {
                      locationPermissionState.launchPermissionRequest()
                  }
                  if (!cameraPermissionState.status.isGranted) {
                      cameraPermissionState.launchPermissionRequest()
                  }
                  if (!recordAudioPermissionState.status.isGranted) {
                      recordAudioPermissionState.launchPermissionRequest()
                  }
                  if (locationPermissionState.status.isGranted) {
                      viewModel.requestLocationUpdate()
                  }
              }
              // 权限状态变化时再尝试获取位置
              LaunchedEffect(locationPermissionState.status) {
                  if (locationPermissionState.status.isGranted) {
                      viewModel.requestLocationUpdate()
                  }
              }

              val cameraLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.TakePicturePreview()
              ) { bitmap ->
                  if (bitmap != null) {
                      viewModel.sendMessage("\u4f60\u770b\u770b\u8fd9\u4e2a", bitmap)
                  }
              }

              // 图片选择（相册）
              val galleryLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri ->
                  if (uri != null) {
                      val bmp = try {
                          val ins = context.contentResolver.openInputStream(uri)
                          ins?.use { android.graphics.BitmapFactory.decodeStream(it) }
                      } catch (e: Exception) { null }
                      if (bmp != null) viewModel.sendMessage("看看这张图片", bmp)
                  }
              }

              // 视频拍摄（调用系统相机）——先检测相机可用性再启动，避免闪退
              var videoOutputUri by remember { mutableStateOf<android.net.Uri?>(null) }
              val videoLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == android.app.Activity.RESULT_OK) {
                      // 优先用相机返回的 data uri；部分 ROM 相机不写 EXTRA_OUTPUT
                      val uri = result.data?.data ?: videoOutputUri
                      if (uri != null) viewModel.sendVideo(uri.toString())
                  }
              }

              fun launchVideoCapture() {
                  try {
                      // 1. 检查是否有相机应用可处理拍摄请求
                      val baseIntent = android.content.Intent(android.provider.MediaStore.ACTION_VIDEO_CAPTURE)
                      val resolve = baseIntent.resolveActivity(context.packageManager)
                      if (resolve == null) {
                          viewModel.sendMessage("未检测到可用的相机应用，请检查系统相机")
                          return
                      }
                      // 2. 准备输出文件
                      val dir = java.io.File(context.cacheDir, "videos")
                      if (!dir.exists()) dir.mkdirs()
                      val file = java.io.File(dir, "video_${System.currentTimeMillis()}.mp4")
                      try {
                          file.createNewFile()
                      } catch (e: Exception) {
                          viewModel.sendMessage("无法创建视频文件: ${e.message}")
                          return
                      }
                      videoOutputUri = androidx.core.content.FileProvider.getUriForFile(
                          context, context.packageName + ".fileprovider", file
                      )
                      // 3. 构建 intent 并授予 URI 读写权限
                      val intent = android.content.Intent(android.provider.MediaStore.ACTION_VIDEO_CAPTURE).apply {
                          putExtra(android.provider.MediaStore.EXTRA_OUTPUT, videoOutputUri)
                          putExtra(android.provider.MediaStore.EXTRA_VIDEO_QUALITY, 1)
                          addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          addFlags(android.content.Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                      }
                      videoLauncher.launch(intent)
                  } catch (e: android.content.ActivityNotFoundException) {
                      viewModel.sendMessage("没有找到能录视频的应用")
                  } catch (e: Exception) {
                      viewModel.sendMessage("无法打开相机: ${e.message}")
                  }
              }

              LaunchedEffect(messages.size) {
                  if (messages.isNotEmpty()) listState.animateScrollToItem(messages.size - 1)
              }

              // 返回键：设置页打开时返回=关设置回聊天页；聊天页时第一次提示、第二次退出
              var backPressedOnce by remember { mutableStateOf(false) }
              BackHandler {
                  if (showSettings) {
                      showSettings = false
                      backPressedOnce = false
                  } else if (backPressedOnce) {
                      val act = context as? android.app.Activity
                      act?.finish()
                  } else {
                      backPressedOnce = true
                      android.widget.Toast.makeText(context, "再按一次返回退出", android.widget.Toast.LENGTH_SHORT).show()
                      kotlinx.coroutines.MainScope().launch {
                          delay(2000)
                          backPressedOnce = false
                      }
                  }
              }

              if (showSettings) {
                  SettingsScreen(onBack = { showSettings = false }, viewModel = viewModel)
              } else {
                  Scaffold(
                      topBar = {
                          TopAppBar(
                              title = {
                                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                      Box(modifier = Modifier.size(40.dp).clip(CircleShape).background(Color(0xFF8B5CF6)), contentAlignment = Alignment.Center) {
                                          Text(companionName.take(1), color = Color.White, fontSize = 18.sp)
                                      }
                                      Column {
                                          Text(companionName, fontSize = 16.sp)
                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              Box(modifier = Modifier.size(6.dp).clip(CircleShape).background(Color(0xFF4ADE80)))
                                              Spacer(modifier = Modifier.width(4.dp))
                                              Text(if (isProcessing) "\u601d\u8003\u4e2d..." else "\u5728\u7ebf", fontSize = 12.sp, color = Color.Gray)
                                              Spacer(modifier = Modifier.width(8.dp))
                                              Surface(shape = RoundedCornerShape(10.dp), color = Color(0xFFE8F5E9)) {
                                                  Text(currentEmotion, fontSize = 10.sp, color = Color(0xFF2E7D32), modifier = Modifier.padding(horizontal = 8.dp, vertical = 2.dp))
                                              }
                                              Spacer(modifier = Modifier.width(4.dp))
                                              Surface(shape = RoundedCornerShape(10.dp), color = Color(0xFFFFF3E0)) {
                                                  Text(relationshipStage, fontSize = 10.sp, color = Color(0xFFE65100), modifier = Modifier.padding(horizontal = 8.dp, vertical = 2.dp))
                                              }
                                          }
                                      }
                                  }
                              },
                              actions = {
                                  IconButton(onClick = { viewModel.toggleVoiceCall() }) {
                                      Icon(
                                          if (isInVoiceCall) Icons.Default.CallEnd else Icons.Default.Call,
                                          null,
                                          tint = if (isInVoiceCall) Color.Red else Color(0xFF4CAF50)
                                      )
                                  }
                                  IconButton(onClick = { showSettings = true }) {
                                      Icon(Icons.Default.Settings, null)
                                  }
                              }
                          )
                      }
                  ) { padding ->
                      Column(modifier = Modifier.fillMaxSize().padding(padding)) {
                          // Q\u7248\u6570\u5b57\u4eba\u533a\u57df\uff08\u53ef\u5f00\u5173\uff09
                          if (avatarEnabled) {
                              // 取最近一条用户消息，让数字人根据对话内容实时演绎动作
                              val lastUserText = messages.lastOrNull { it.isUser }?.content ?: ""
                              DigitalHumanPanel(
                                  emotion = currentEmotion,
                                  status = companionStatus,
                                  userInput = lastUserText,
                                  isProcessing = isProcessing,
                                  companionName = companionName,
                                  avatarImage = avatarImage
                              )
                          }

                          if (isProcessing) {
                              Surface(modifier = Modifier.fillMaxWidth().padding(16.dp), shape = RoundedCornerShape(12.dp), tonalElevation = 4.dp) {
                                  Row(modifier = Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                      CircularProgressIndicator(modifier = Modifier.size(16.dp), strokeWidth = 2.dp)
                                      Spacer(modifier = Modifier.width(8.dp))
                                      Text("${companionName}\u6b63\u5728\u601d\u8003...", fontSize = 12.sp, color = Color.Gray)
                                  }
                              }
                          }

                          LazyColumn(
                              state = listState,
                              modifier = Modifier.weight(1f).padding(horizontal = 16.dp),
                              verticalArrangement = Arrangement.spacedBy(12.dp),
                              contentPadding = PaddingValues(vertical = 16.dp)
                          ) {
                              items(messages) { msg -> ChatBubble(msg) }
                          }

                          Surface(tonalElevation = 2.dp) {
                              Column {
                                  Row(
                                      modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      // 语音键（最左边，微信样式）
                                      IconButton(
                                          onClick = {
                                              if (inputText.isNotBlank()) {
                                                  viewModel.sendMessage(inputText)
                                                  inputText = ""
                                              } else if (isRecording) {
                                                  viewModel.cancelRecording()
                                              } else {
                                                  if (recordAudioPermissionState.status.isGranted) {
                                                      viewModel.toggleRecording()
                                                  } else {
                                                      recordAudioPermissionState.launchPermissionRequest()
                                                  }
                                              }
                                          },
                                          modifier = Modifier.size(40.dp)
                                      ) {
                                          Icon(
                                              if (isRecording) Icons.Default.Stop else Icons.Default.Mic,
                                              null,
                                              tint = if (isRecording) Color(0xFFEF5350) else Color(0xFF1C1C1E)
                                          )
                                      }

                                      // 输入框
                                      OutlinedTextField(
                                          value = inputText,
                                          onValueChange = { inputText = it },
                                          modifier = Modifier.weight(1f),
                                          placeholder = { Text(if (isRecording) "正在聊听..." else "输入消息...") },
                                          shape = RoundedCornerShape(24.dp),
                                          singleLine = true,
                                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Send),
                                          keyboardActions = KeyboardActions(onSend = {
                                              if (inputText.isNotBlank()) {
                                                  viewModel.sendMessage(inputText)
                                                  inputText = ""
                                              }
                                          })
                                      )

                                      // 右侧：有文字时显示发送，无文字时 + 号
                                      if (inputText.isNotBlank()) {
                                          Box(
                                              modifier = Modifier
                                                  .size(40.dp)
                                                  .clip(CircleShape)
                                                  .background(Color(0xFF1C1C1E))
                                                  .clickable {
                                                      viewModel.sendMessage(inputText)
                                                      inputText = ""
                                                  },
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Icon(Icons.Default.Send, null, tint = Color.White, modifier = Modifier.size(18.dp))
                                          }
                                      } else {
                                          IconButton(onClick = { showMorePanel = !showMorePanel }, modifier = Modifier.size(40.dp)) {
                                              Icon(Icons.Default.Add, null, tint = Color(0xFF1C1C1E))
                                          }
                                      }
                                  }

                                  // + 号展开面板：相册 / 拍照 / 位置 / 视频
                                  if (showMorePanel) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 10.dp),
                                          horizontalArrangement = Arrangement.spacedBy(20.dp)
                                      ) {
                                          MoreActionItem(
                                              icon = Icons.Default.PhotoLibrary,
                                              label = "相册",
                                              onClick = {
                                                  galleryLauncher.launch("image/*")
                                                  showMorePanel = false
                                              }
                                          )
                                          // 拍照：单击=拍照，长按=录像（相机权限未授予时自动申请）
                                          MoreActionItem(
                                              icon = Icons.Default.PhotoCamera,
                                              label = "拍照",
                                              onClick = {
                                                  if (cameraPermissionState.status.isGranted) {
                                                      cameraLauncher.launch(null)
                                                  } else {
                                                      cameraPermissionState.launchPermissionRequest()
                                                  }
                                                  showMorePanel = false
                                              },
                                              onLongClick = {
                                                  if (cameraPermissionState.status.isGranted) {
                                                      launchVideoCapture()
                                                  } else {
                                                      cameraPermissionState.launchPermissionRequest()
                                                  }
                                                  showMorePanel = false
                                              }
                                          )
                                          MoreActionItem(
                                              icon = Icons.Default.Place,
                                              label = "位置",
                                              onClick = {
                                                  if (locationPermissionState.status.isGranted) viewModel.sendLocation() else locationPermissionState.launchPermissionRequest()
                                                  showMorePanel = false
                                              }
                                          )
                                          // 录像：独立按钮，点击启动录像（拍照与录像分开）
                                          MoreActionItem(
                                              icon = Icons.Default.Videocam,
                                              label = "录像",
                                              onClick = {
                                                  if (cameraPermissionState.status.isGranted) {
                                                      launchVideoCapture()
                                                  } else {
                                                      cameraPermissionState.launchPermissionRequest()
                                                  }
                                                  showMorePanel = false
                                              }
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ChatBubble(message: ChatMessage) {
              val isUser = message.isUser
              val context = androidx.compose.ui.platform.LocalContext.current
              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start) {
                  Column(horizontalAlignment = if (isUser) Alignment.End else Alignment.Start) {
                      message.imageBase64?.let { base64 ->
                          val imageBytes = android.util.Base64.decode(base64, android.util.Base64.DEFAULT)
                          val bitmap = android.graphics.BitmapFactory.decodeByteArray(imageBytes, 0, imageBytes.size)
                          bitmap?.let {
                              Image(
                                  bitmap = it.asImageBitmap(),
                                  contentDescription = null,
                                  modifier = Modifier
                                      .sizeIn(maxWidth = 200.dp, maxHeight = 200.dp)
                                      .clip(RoundedCornerShape(12.dp))
                              )
                              Spacer(modifier = Modifier.height(4.dp))
                          }
                      }

                      message.videoPath?.let { path ->
                          Surface(
                              onClick = {
                                  try {
                                      val intent = android.content.Intent(android.content.Intent.ACTION_VIEW).apply {
                                          setDataAndType(android.net.Uri.parse(path), "video/*")
                                          addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      }
                                      context.startActivity(intent)
                                  } catch (e: Exception) {}
                              },
                              shape = RoundedCornerShape(12.dp),
                              color = if (isUser) Color(0xFF2C2C2E) else Color(0xFFE8EAF6)
                          ) {
                              Row(modifier = Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Icon(Icons.Default.PlayArrow, null, tint = Color(0xFF4CAF50))
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text(if (isUser) "视频" else "点击播放视频", color = if (isUser) Color.White else Color(0xFF1C1C1E), fontSize = 13.sp)
                              }
                          }
                          Spacer(modifier = Modifier.height(4.dp))
                      }

                      Surface(
                          shape = RoundedCornerShape(
                              topStart = 16.dp, topEnd = 16.dp,
                              bottomStart = if (isUser) 16.dp else 4.dp,
                              bottomEnd = if (isUser) 4.dp else 16.dp
                          ),
                          color = if (isUser) Color(0xFF1C1C1E) else Color(0xFFF2F2F7)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text(message.content, color = if (isUser) Color.White else Color.Black, fontSize = 14.sp, lineHeight = 20.sp)
                              message.taskLabel?.let {
                                  Spacer(modifier = Modifier.height(6.dp))
                                  Surface(shape = RoundedCornerShape(6.dp), color = if (isUser) Color(0x33FFFFFF) else Color(0x1F6750A4)) {
                                      Text(it, fontSize = 10.sp, color = if (isUser) Color(0xFFE0E0E0) else Color(0xFF6750A4), modifier = Modifier.padding(horizontal = 8.dp, vertical = 2.dp))
                                  }
                              }
                              message.memoryHint?.let {
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text(it, fontSize = 10.sp, color = if (isUser) Color(0xB3FFFFFF) else Color.Gray, fontStyle = androidx.compose.ui.text.font.FontStyle.Italic)
                              }
                          }
                      }
                  }
              }
          }
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun MoreActionItem(icon: androidx.compose.ui.graphics.vector.ImageVector, label: String, onClick: () -> Unit, onLongClick: (() -> Unit)? = null) {
              val mod = if (onLongClick != null) {
                  Modifier.combinedClickable(onClick = onClick, onLongClick = onLongClick)
              } else {
                  Modifier.clickable(onClick = onClick)
              }
              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = mod) {
                  Box(
                      modifier = Modifier
                          .size(48.dp)
                          .clip(CircleShape)
                          .background(Color(0xFFF2F2F7)),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(icon, null, tint = Color(0xFF1C1C1E), modifier = Modifier.size(26.dp))
                  }
                  Spacer(modifier = Modifier.height(4.dp))
                  Text(label, fontSize = 11.sp, color = Color(0xFF3A3A3C))
              }
          }

          // ===== Q版数字人（Canvas 绘制，根据情绪/活动切换表情动作）=====
          @Composable
          fun DigitalHumanPanel(emotion: String, status: String, isProcessing: Boolean, companionName: String, avatarImage: String = "", userInput: String = "") {
              val mood = when {
                  emotion.contains("开心") -> 0
                  emotion.contains("难过") -> 1
                  emotion.contains("生气") -> 2
                  emotion.contains("担心") -> 3
                  else -> 0
              }
              // 用户上传的自定义形象图（base64），有则优先显示
              val customAvatar = remember(avatarImage) {
                  if (avatarImage.isNotBlank()) {
                      try {
                          val bytes = android.util.Base64.decode(avatarImage, android.util.Base64.DEFAULT)
                          android.graphics.BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                      } catch (e: Exception) { null }
                  } else null
              }
              // 实时动作：优先根据用户对话内容，其次根据当前状态
              val action = when {
                  userInput.contains("跑步") || userInput.contains("跑") || userInput.contains("锻炼") || status.contains("跑步") -> "running"
                  userInput.contains("读书") || userInput.contains("看书") || userInput.contains("书") || status.contains("看") || status.contains("书") -> "reading"
                  userInput.contains("吃饭") || userInput.contains("吃") || status.contains("吃") -> "eating"
                  userInput.contains("睡觉") || userInput.contains("睡") || status.contains("睡") -> "sleeping"
                  userInput.contains("散步") || userInput.contains("走") || status.contains("散步") -> "walking"
                  userInput.contains("唱歌") || userInput.contains("音乐") || userInput.contains("听歌") -> "singing"
                  userInput.contains("跳舞") || userInput.contains("跳") -> "dancing"
                  else -> "idle"
              }
              // 呼吸/待机动画
              val transition = rememberInfiniteTransition(label = "avatar")
              val bob by transition.animateFloat(
                  initialValue = 0f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(durationMillis = 1200, easing = LinearEasing),
                      repeatMode = RepeatMode.Reverse
                  ),
                  label = "bob"
              )
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(210.dp)
                      .background(Color(0xFFF8F6FF)),
                  contentAlignment = Alignment.Center
              ) {
                  if (customAvatar != null) {
                      // 用户上传的自定义形象：铺满整个上部区域（不裁圆，整幅显示 + 轻微呼吸）
                      Image(
                          bitmap = customAvatar.asImageBitmap(),
                          contentDescription = null,
                          contentScale = androidx.compose.ui.layout.ContentScale.Crop,
                          modifier = Modifier
                              .fillMaxWidth()
                              .fillMaxHeight()
                              .graphicsLayer {
                                  val s = 1f + (bob - 0.5f) * 0.03f
                                  scaleX = s
                                  scaleY = s
                              }
                      )
                  } else {
                  Canvas(modifier = Modifier.size(170.dp)) {
                      val w = size.width
                      val h = size.height
                      val cx = w / 2f
                      val cy = h / 2f + bob * 6f
                      val hairColor = androidx.compose.ui.graphics.Color(0xFF6D4C8C)
                      val skinColor = androidx.compose.ui.graphics.Color(0xFFFFE0C4)
                      val bodyColor = androidx.compose.ui.graphics.Color(0xFFB39DDB)

                      // 身体
                      drawRoundRect(
                          color = bodyColor,
                          topLeft = androidx.compose.ui.geometry.Offset(cx - 45f, cy + 30f),
                          size = androidx.compose.ui.geometry.Size(90f, 70f),
                          cornerRadius = androidx.compose.ui.geometry.CornerRadius(30f)
                      )
                      // 头
                      drawCircle(color = skinColor, radius = 48f, center = androidx.compose.ui.geometry.Offset(cx, cy - 20f))
                      // 头发（上弧）
                      drawArc(
                          color = hairColor,
                          startAngle = 180f, sweepAngle = 180f,
                          useCenter = true,
                          topLeft = androidx.compose.ui.geometry.Offset(cx - 48f, cy - 68f),
                          size = androidx.compose.ui.geometry.Size(96f, 96f)
                      )
                      // 眼睛
                      val eyeY = cy - 22f
                      val eyeDX = 20f
                      when (mood) {
                          0 -> { // 开心 - 弯弯笑眼
                              drawArc(color = androidx.compose.ui.graphics.Color(0xFF333333), startAngle = 0f, sweepAngle = 180f, useCenter = false,
                                  topLeft = androidx.compose.ui.geometry.Offset(cx - eyeDX - 12f, eyeY - 4f), size = androidx.compose.ui.geometry.Size(24f, 24f))
                              drawArc(color = androidx.compose.ui.graphics.Color(0xFF333333), startAngle = 0f, sweepAngle = 180f, useCenter = false,
                                  topLeft = androidx.compose.ui.geometry.Offset(cx + eyeDX - 12f, eyeY - 4f), size = androidx.compose.ui.geometry.Size(24f, 24f))
                          }
                          1 -> { // 难过 - 流泪眼
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFF333333), radius = 6f, center = androidx.compose.ui.geometry.Offset(cx - eyeDX, eyeY))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFF333333), radius = 6f, center = androidx.compose.ui.geometry.Offset(cx + eyeDX, eyeY))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFF90CAF9), radius = 3f, center = androidx.compose.ui.geometry.Offset(cx - eyeDX, eyeY + 8f))
