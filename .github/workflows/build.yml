      # 12. VoiceCallManager（基于 xiaozhi-android-native）
      - run: |
          cat > app/src/main/java/com/example/stellae/integrations/VoiceCallManager.kt << 'EOF'
          package com.example.stellae.integrations

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioManager
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import java.nio.ByteBuffer
          import java.util.concurrent.TimeUnit
          import kotlinx.coroutines.*
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import okio.ByteString

          /**
           * 实时语音通话管理器
           * 参考: https://github.com/DayanJ/xiaozhi-android-native
           * 使用 WebSocket + 16kHz PCM 实现实时双向语音
           *
           * 重要：语音通话需要一个真实的后端服务。请在 App 设置里填写
           * "语音通话服务地址"（wss://你的服务器/ws）。
           * 协议约定：客户端上行发送 16kHz/16bit/单声道 PCM 音频帧，
           * 服务端下行返回文本回复或 16kHz PCM 音频帧。
           * 可部署的开源后端：小智 xiaozhi-server（https://github.com/78/xiaozhi-server）
           */
          class VoiceCallManager(private val context: Context) {
              private var webSocket: WebSocket? = null
              private var audioRecord: AudioRecord? = null
              private var audioTrack: AudioTrack? = null
              private var recordingJob: Job? = null
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private val client = OkHttpClient.Builder()
                  .connectTimeout(10, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .build()
              private var isRunning = false

              fun startCall(serverUrl: String, onStart: () -> Unit, onMessage: (String) -> Unit, onError: (String) -> Unit) {
                  if (isRunning) return
                  if (serverUrl.isBlank()) {
                      onError("未配置语音服务地址，请先在设置里填写")
                      return
                  }
                  isRunning = true

                  val request = Request.Builder().url(serverUrl).build()
                  webSocket = client.newWebSocket(request, object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: okhttp3.Response) {
                          onStart()
                          startRecording(onError)
                      }
                      override fun onMessage(webSocket: WebSocket, text: String) {
                          onMessage(text) // 收到 AI 文字回复
                      }
                      override fun onMessage(webSocket: WebSocket, bytes: ByteString) {
                          playAudio(bytes) // 收到 AI 音频（16kHz PCM）
                      }
                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: okhttp3.Response?) {
                          stopRecording()
                          onError(t.message ?: "连接失败")
                      }
                  })
              }

              // 采集麦克风 PCM 音频并实时通过 WebSocket 发送
              private fun startRecording(onError: (String) -> Unit) {
                  try {
                      val sampleRate = 16000
                      val minBuf = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      audioRecord = AudioRecord(
                          MediaRecorder.AudioSource.MIC, sampleRate, AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT, minBuf * 4
                      ).apply { startRecording() }
                      recordingJob = scope.launch {
                          val buffer = ShortArray(minBuf)
                          while (isRunning) {
                              val read = audioRecord?.read(buffer, 0, buffer.size) ?: -1
                              if (read > 0) {
                                  val byteBuf = ByteBuffer.allocate(read * 2)
                                  for (i in 0 until read) byteBuf.putShort(buffer[i])
                                  webSocket?.send(ByteString.of(*byteBuf.array()))
                              }
                          }
                      }
                  } catch (e: Exception) {
                      onError("录音启动失败: ${e.message}")
                  }
              }

              // 播放服务器返回的 16kHz PCM 音频
              private fun playAudio(bytes: ByteString) {
                  try {
                      if (audioTrack == null) {
                          val minBuf = AudioTrack.getMinBufferSize(16000, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                          audioTrack = AudioTrack(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build(),
                              AudioFormat.Builder()
                                  .setSampleRate(16000)
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build(),
                              minBuf, AudioTrack.MODE_STREAM, AudioManager.AUDIO_SESSION_ID_GENERATE
                          ).apply { play() }
                      }
                      val pcm = bytes.toByteArray()
                      // 使用带 writeMode 的四参数重载，避免 Kotlin 重载歧义
                      audioTrack?.write(pcm, 0, pcm.size, AudioTrack.WRITE_BLOCKING)
                  } catch (e: Exception) {
                      // 播放失败忽略
                  }
              }

              private fun stopRecording() {
                  recordingJob?.cancel()
                  try { audioRecord?.stop() } catch (_: Exception) {}
                  audioRecord?.release()
                  audioRecord = null
              }

              fun endCall() {
                  isRunning = false
                  stopRecording()
                  try { audioTrack?.stop() } catch (_: Exception) {}
                  audioTrack?.release()
                  audioTrack = null
                  webSocket?.close(1000, "用户挂断")
                  webSocket = null
              }

              fun sendText(text: String) {
                  webSocket?.send(text)
              }
          }
          EOF

