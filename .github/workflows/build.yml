      - run: |
          cat > app/src/main/java/com/example/stellae/core/MemoryDecayEngine.kt << 'EOF'
          package com.example.stellae.core
          import com.example.stellae.data.MemoryEntity
          import kotlin.math.exp
          import kotlin.math.ln
          class MemoryDecayEngine {
              companion object {
                  const val HALF_LIFE_TRIVIAL = 14.0
                  const val HALF_LIFE_NORMAL = 30.0
                  const val HALF_LIFE_IMPORTANT = 90.0
                  const val HALF_LIFE_CORE = 365.0
              }
              fun calculateFreshness(memory: MemoryEntity, currentTime: Long = System.currentTimeMillis()): Double {
                  val ageDays = (currentTime - memory.timestamp) / (1000.0 * 60 * 60 * 24)
                  val halfLife = when (memory.importance) {
                      1 -> HALF_LIFE_TRIVIAL
                      2 -> HALF_LIFE_TRIVIAL * 1.5
                      3 -> HALF_LIFE_NORMAL
                      4 -> HALF_LIFE_IMPORTANT
                      5 -> HALF_LIFE_CORE
                      else -> HALF_LIFE_NORMAL
                  }
                  val lambda = ln(2.0) / halfLife
                  return exp(-lambda * ageDays).coerceIn(0.0, 1.0)
              }
              fun rankMemories(memories: List<MemoryEntity>): List<RankedMemory> {
                  val now = System.currentTimeMillis()
                  return memories.map { memory ->
                      val freshness = calculateFreshness(memory, now)
                      val score = memory.importance * freshness
                      RankedMemory(memory, freshness, score)
                  }.sortedByDescending { it.score }
              }
              fun getRecallableMemories(memories: List<MemoryEntity>, threshold: Double = 0.15, maxCount: Int = 5): List<MemoryEntity> {
                  return rankMemories(memories).filter { it.freshness >= threshold }.take(maxCount).map { it.memory }
              }
              fun refreshMemoryOnRecall(memory: MemoryEntity): MemoryEntity {
                  return memory.copy(timestamp = System.currentTimeMillis(), importance = (memory.importance + 1).coerceAtMost(5))
              }
          }
          data class RankedMemory(val memory: MemoryEntity, val freshness: Double, val score: Double)
          EOF
      - run: |
          cat > app/src/main/java/com/example/stellae/core/EmotionEngine.kt << 'EOF'
          package com.example.stellae.core
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          class EmotionEngine {
              companion object {
                  const val EMOTION_JOY = "joy"
                  const val EMOTION_SADNESS = "sadness"
                  const val EMOTION_ANGER = "anger"
                  const val EMOTION_FEAR = "fear"
                  const val EMOTION_TRUST = "trust"
                  const val EMOTION_DISGUST = "disgust"
                  const val EMOTION_ANTICIPATION = "anticipation"
                  const val EMOTION_SURPRISE = "surprise"
                  const val MAX_INTENSITY = 10.0
              }
              private val activeEmotions = mutableMapOf<String, EmotionState>()
              private var affinityScore = 0.0
              private var relationshipStage = RelationshipStage.STRANGER
              fun processEvent(event: EmotionalEvent): List<EmotionState> {
                  val newEmotions = mutableListOf<EmotionState>()
                  when (event.type) {
                      EventType.USER_PRAISE -> {
                          newEmotions.add(createEmotion(EMOTION_JOY, event.intensity * 0.8))
                          affinityScore = min(MAX_INTENSITY, affinityScore + event.intensity * 0.5)
                      }
                      EventType.USER_HURTFUL -> {
                          newEmotions.add(createEmotion(EMOTION_SADNESS, event.intensity * 0.7))
                          newEmotions.add(createEmotion(EMOTION_ANGER, event.intensity * 0.4))
                          affinityScore = max(-MAX_INTENSITY, affinityScore - event.intensity * 0.8)
                          relationshipStage = RelationshipStage.CONFLICT
                      }
                      EventType.USER_APOLOGY -> {
                          accelerateDecay(EMOTION_SADNESS, 2.0)
                          accelerateDecay(EMOTION_ANGER, 3.0)
                          newEmotions.add(createEmotion(EMOTION_JOY, event.intensity * 0.5))
                          affinityScore = min(MAX_INTENSITY, affinityScore + event.intensity * 0.6)
                          if (relationshipStage == RelationshipStage.CONFLICT) relationshipStage = RelationshipStage.RECONCILING
                      }
                      EventType.USER_SHARE_GOOD -> newEmotions.add(createEmotion(EMOTION_JOY, event.intensity * 0.6))
                      EventType.USER_SHARE_BAD -> newEmotions.add(createEmotion(EMOTION_SADNESS, event.intensity * 0.5))
                      else -> {}
                  }
                  newEmotions.forEach { mergeEmotion(it) }
                  updateRelationshipStage()
                  return newEmotions
              }
              fun tick(elapsedMinutes: Double = 5.0) {
                  val toRemove = mutableListOf<String>()
                  activeEmotions.forEach { (type, state) ->
                      val halfLife = when (type) {
                          EMOTION_SURPRISE -> 30.0
                          EMOTION_JOY, EMOTION_ANTICIPATION -> 120.0
                          EMOTION_TRUST -> 240.0
                          EMOTION_FEAR, EMOTION_SADNESS -> 480.0
                          EMOTION_ANGER -> 576.0
                          EMOTION_DISGUST -> 1440.0
                          else -> 120.0
                      }
                      val lambda = kotlin.math.ln(2.0) / halfLife
                      val newIntensity = state.intensity * exp(-lambda * elapsedMinutes)
                      if (newIntensity < 0.3) toRemove.add(type)
                      else activeEmotions[type] = state.copy(intensity = newIntensity)
                  }
                  toRemove.forEach { activeEmotions.remove(it) }
                  if (relationshipStage == RelationshipStage.CONFLICT && activeEmotions[EMOTION_ANGER] == null && activeEmotions[EMOTION_SADNESS] == null) {
                      relationshipStage = RelationshipStage.NORMAL
                  }
              }
              fun getDominantEmotion(): String = activeEmotions.maxByOrNull { it.value.intensity }?.key ?: EMOTION_JOY
              fun getEmotionIntensity(type: String): Double = activeEmotions[type]?.intensity ?: 0.0
              fun getEmotionLabel(): String {
                  val dominant = getDominantEmotion()
                  val intensity = getEmotionIntensity(dominant)
                  return when (dominant) {
                      EMOTION_JOY -> if (intensity > 7) "\u8d85\u7ea7\u5f00\u5fc3" else if (intensity > 4) "\u5f00\u5fc3" else "\u6e29\u67d4"
                      EMOTION_SADNESS -> if (intensity > 4) "\u5f88\u96be\u8fc7" else "\u5fc3\u75bc"
                      EMOTION_ANGER -> if (intensity > 6) "\u751f\u6c14" else if (intensity > 3) "\u59d4\u5c48" else "\u4e0d\u5f00\u5fc3"
                      EMOTION_FEAR -> "\u62c5\u5fc3"
                      EMOTION_TRUST -> "\u4fe1\u4efb"
                      else -> "\u6e29\u67d4"
                  }
              }
              fun getRelationshipStage(): RelationshipStage = relationshipStage
              fun getAffinityScore(): Double = affinityScore
              fun inferEventFromText(text: String): EmotionalEvent? {
                  val lower = text.lowercase()
                  return when {
                      lower.contains("\u8c22\u8c22") || lower.contains("\u771f\u597d") || lower.contains("\u559c\u6b22\u4f60") || lower.contains("\u68d2") -> EmotionalEvent(EventType.USER_PRAISE, 6.0)
                      lower.contains("\u6eda") || lower.contains("\u70e6") || lower.contains("\u95ed\u5634") || lower.contains("\u8ba8\u538c\u4f60") -> EmotionalEvent(EventType.USER_HURTFUL, 8.0)
                      lower.contains("\u5bf9\u4e0d\u8d77") || lower.contains("\u62b1\u6b49") || lower.contains("\u6211\u9519\u4e86") -> EmotionalEvent(EventType.USER_APOLOGY, 7.0)
                      lower.contains("\u5f00\u5fc3") || lower.contains("\u9ad8\u5174") || lower.contains("\u6210\u529f\u4e86") -> EmotionalEvent(EventType.USER_SHARE_GOOD, 5.0)
                      lower.contains("\u96be\u8fc7") || lower.contains("\u5931\u8d25\u4e86") || lower.contains("\u4e22\u4e86") -> EmotionalEvent(EventType.USER_SHARE_BAD, 6.0)
                      else -> null
                  }
              }
              private fun createEmotion(type: String, intensity: Double) = EmotionState(type, intensity.coerceIn(0.0, MAX_INTENSITY), System.currentTimeMillis())
              private fun mergeEmotion(newEmotion: EmotionState) {
                  val existing = activeEmotions[newEmotion.type]
                  if (existing != null) {
                      val merged = MAX_INTENSITY * (1 - exp(-(existing.intensity + newEmotion.intensity) / MAX_INTENSITY))
                      activeEmotions[newEmotion.type] = existing.copy(intensity = merged)
                  } else activeEmotions[newEmotion.type] = newEmotion
              }
              private fun accelerateDecay(type: String, multiplier: Double) {
                  activeEmotions[type]?.let { activeEmotions[type] = it.copy(intensity = it.intensity / multiplier) }
              }
              private fun updateRelationshipStage() {
                  relationshipStage = when {
                      relationshipStage == RelationshipStage.CONFLICT -> RelationshipStage.CONFLICT
                      relationshipStage == RelationshipStage.RECONCILING -> RelationshipStage.RECONCILING
                      affinityScore > 7 -> RelationshipStage.CLOSE
                      affinityScore > 3 -> RelationshipStage.FAMILIAR
                      affinityScore > 0 -> RelationshipStage.NORMAL
                      else -> RelationshipStage.STRANGER
                  }
              }
          }
          data class EmotionState(val type: String, val intensity: Double, val createdAt: Long)
          data class EmotionalEvent(val type: EventType, val intensity: Double)
          enum class EventType { USER_PRAISE, USER_HURTFUL, USER_APOLOGY, USER_SHARE_GOOD, USER_SHARE_BAD, AI_GOAL_ACHIEVED, AI_GOAL_FAILED, SURPRISE }
          enum class RelationshipStage { STRANGER, NORMAL, FAMILIAR, CLOSE, CONFLICT, RECONCILING }
          EOF
      - run: |
          cat > app/src/main/java/com/example/stellae/core/OpenLoopManager.kt << 'EOF'
          package com.example.stellae.core
          class OpenLoopManager(private val context: android.content.Context) {
              private val openLoops = mutableListOf<OpenLoopItem>()
              fun extractOpenLoops(userInput: String): List<OpenLoopItem> {
                  val loops = mutableListOf<OpenLoopItem>()
                  val now = System.currentTimeMillis()
                  val tomorrowPattern = Regex("(\u660e\u5929|\u540e\u5929|\u4e0b\u5468|\u8fc7\u51e0\u5929|\u7b49\u4f1a\u513f|\u4eca\u665a|\u660e\u5929\u65e9\u4e0a|\u660e\u5929\u665a\u4e0a)(.+?)[\uff0c\u3002\uff01\uff1f]")
                  tomorrowPattern.findAll(userInput).forEach { match ->
                      val timeRef = match.groupValues[1]
                      val event = match.groupValues[2].trim()
                      if (event.isNotEmpty() && event.length > 2) {
                          loops.add(OpenLoopItem(System.nanoTime(), event, calculateTriggerTime(timeRef), OpenLoopStatus.PENDING, now))
                      }
                  }
                  val planPattern = Regex("(\u6211\u8981|\u6253\u7b97|\u8ba1\u5212|\u51c6\u5907|\u60f3)(.+?)[\uff0c\u3002\uff01\uff1f]")
                  planPattern.findAll(userInput).forEach { match ->
                      val event = match.groupValues[2].trim()
                      if (event.isNotEmpty() && event.length > 3) {
                          loops.add(OpenLoopItem(System.nanoTime(), event, now + 24 * 60 * 60 * 1000, OpenLoopStatus.PENDING, now))
                      }
                  }
                  openLoops.addAll(loops)
                  return loops
              }
              fun checkDueLoops(): List<OpenLoopItem> {
                  val now = System.currentTimeMillis()
                  return openLoops.filter { it.status == OpenLoopStatus.PENDING && it.triggerTime <= now }
              }
              fun resolveLoop(loopId: Long, userResponse: String): OpenLoopResolution {
                  val lower = userResponse.lowercase()
                  val loop = openLoops.find { it.id == loopId } ?: return OpenLoopResolution.UNKNOWN
                  val resolution = when {
                      lower.contains("\u8fc7\u4e86") || lower.contains("\u6210\u4e86") || lower.contains("\u6210\u529f\u4e86") || lower.contains("\u987a\u5229") -> OpenLoopResolution.COMPLETED
                      lower.contains("\u6ca1\u8fc7") || lower.contains("\u5931\u8d25\u4e86") || lower.contains("\u6302\u4e86") -> OpenLoopResolution.FAILED
                      lower.contains("\u63a8\u8fdf") || lower.contains("\u6539\u5929") || lower.contains("\u4e0b\u6b21") -> OpenLoopResolution.POSTPONED
                      else -> OpenLoopResolution.UNKNOWN
                  }
                  when (resolution) {
                      OpenLoopResolution.COMPLETED -> { loop.status = OpenLoopStatus.COMPLETED; loop.resolvedAt = System.currentTimeMillis() }
                      OpenLoopResolution.FAILED -> { loop.status = OpenLoopStatus.FAILED; loop.resolvedAt = System.currentTimeMillis() }
                      OpenLoopResolution.POSTPONED -> { loop.triggerTime += 24 * 60 * 60 * 1000 }
                      else -> {}
                  }
                  return resolution
              }
              fun generateFollowUpMessage(loop: OpenLoopItem): String {
                  val hoursAgo = (System.currentTimeMillis() - loop.createdAt) / (1000 * 60 * 60)
                  return when {
                      hoursAgo < 24 -> "\u5bf9\u4e86\uff0c\u4f60\u4e4b\u524d\u8bf4${loop.description}\uff0c\u73b0\u5728\u600e\u4e48\u6837\u4e86\uff1f"
                      hoursAgo < 72 -> "\u8fd8\u8bb0\u5f97\u4f60${hoursAgo.toInt()}\u5c0f\u65f6\u524d\u63d0\u5230\u7684${loop.description}\u5417\uff1f\u6709\u7ed3\u679c\u4e86\u5417\uff1f"
                      else -> "\u597d\u4e45\u4e4b\u524d\u4f60\u63d0\u8fc7${loop.description}\uff0c\u6211\u4e00\u76f4\u8bb0\u7740\u5462\uff5e\u540e\u6765\u600e\u4e48\u6837\u4e86\uff1f"
                  }
              }
              fun cleanupOldLoops() {
                  val cutoff = System.currentTimeMillis() - 7 * 24 * 60 * 60 * 1000
                  openLoops.removeAll { (it.status == OpenLoopStatus.COMPLETED || it.status == OpenLoopStatus.FAILED) && (it.resolvedAt ?: 0) < cutoff }
              }
              private fun calculateTriggerTime(timeRef: String): Long {
                  val now = System.currentTimeMillis()
                  return when (timeRef) {
