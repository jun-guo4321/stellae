name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: |
          mkdir -p app/src/main/java/com/example/stellae/core
          mkdir -p app/src/main/java/com/example/stellae/data
          mkdir -p app/src/main/java/com/example/stellae/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          org.gradle.caching=true
          EOF
      - run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.example.stellae"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.stellae"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              kotlinOptions { jvmTarget = "1.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.accompanist:accompanist-permissions:0.32.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              implementation("com.squareup.retrofit2:retrofit:2.9.0")
              implementation("com.squareup.retrofit2:converter-gson:2.9.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF
      - run: |
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.devtools.ksp") version "1.9.22-1.0.17" apply false
          }
          EOF
      - run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Stellae"
          include(":app")
          EOF
      - run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>
              <application android:label="星黎" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
      - run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">星黎</string></resources>
          EOF
      - run: |
          cat > app/src/main/java/com/example/stellae/ChatMessage.kt << 'EOF'
          package com.example.stellae
          data class ChatMessage(
              val content: String,
              val isUser: Boolean,
              val taskLabel: String? = null,
              val memoryHint: String? = null,
              val timestamp: Long = System.currentTimeMillis()
          )
          data class OrchestrationStep(val description: String, val status: StepStatus)
          enum class StepStatus { DONE, ACTIVE, PENDING }
          EOF
      - run: |
          cat > app/src/main/java/com/example/stellae/data/MemoryEntity.kt << 'EOF'
          package com.example.stellae.data
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          import androidx.room.Dao
          import androidx.room.Insert
          import androidx.room.Query
          import androidx.room.Delete
          @Entity(tableName = "memories")
          data class MemoryEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val content: String,
              val category: String,
              val timestamp: Long = System.currentTimeMillis(),
              val importance: Int = 1
          )
          @Dao
          interface MemoryDao {
              @Insert suspend fun insert(memory: MemoryEntity): Long
              @Query("SELECT * FROM memories ORDER BY timestamp DESC LIMIT 50") suspend fun getAllMemories(): List<MemoryEntity>
              @Query("SELECT * FROM memories WHERE content LIKE '%' || :keyword || '%' ORDER BY importance DESC, timestamp DESC LIMIT 10") suspend fun searchMemories(keyword: String): List<MemoryEntity>
              @Query("SELECT * FROM memories WHERE category = :category ORDER BY timestamp DESC LIMIT 20") suspend fun getMemoriesByCategory(category: String): List<MemoryEntity>
              @Delete suspend fun delete(memory: MemoryEntity)
              @Query("DELETE FROM memories WHERE timestamp < :cutoffTime") suspend fun deleteOldMemories(cutoffTime: Long)
          }
          EOF
      - run: |
          cat > app/src/main/java/com/example/stellae/data/AppDatabase.kt << 'EOF'
          package com.example.stellae.data
          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase
          @Database(entities = [MemoryEntity::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun memoryDao(): MemoryDao
              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getDatabase(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, "stellae_memory.db").build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
          }
          EOF
      - run: |
          cat > app/src/main/java/com/example/stellae/ui/theme/StellaeTheme.kt << 'EOF'
