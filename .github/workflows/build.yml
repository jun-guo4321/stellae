              companion object {
                  fun bitmapToBase64(bitmap: Bitmap): String {
                      val outputStream = ByteArrayOutputStream()
                      bitmap.compress(Bitmap.CompressFormat.JPEG, 85, outputStream)
                      return Base64.encodeToString(outputStream.toByteArray(), Base64.NO_WRAP)
                  }
              }
          }

          enum class TaskType(val label: String, val description: String) {
              CHAT("\u95f2\u804a\u6a21\u5f0f", "\u65e5\u5e38\u95f2\u804a"),
              WEATHER("\u5929\u6c14\u67e5\u8be2", "\u67e5\u8be2\u5929\u6c14"),
              TIME("\u65f6\u95f4\u63d0\u9192", "\u65f6\u95f4\u76f8\u5173"),
              EMOTIONAL_SUPPORT("\u60c5\u611f\u966a\u4f34", "\u60c5\u611f\u652f\u6301"),
              BOUNDARY("\u4ef7\u503c\u89c2\u56de\u7b54", "\u8fb9\u754c\u8ba8\u8bba"),
              APOLOGY("\u51b2\u7a81\u5f27: \u9053\u6b49\u5904\u7406", "\u9053\u6b49\u5904\u7406"),
              VISION("\u89c6\u89c9\u5206\u6790", "\u56fe\u7247\u5206\u6790")
          }

          data class ChatCompletionResponse(@SerializedName("choices") val choices: List<Choice>?)
          data class Choice(@SerializedName("message") val message: Message?)
          data class Message(@SerializedName("content") val content: String?)
          EOF
      - run: |
          cat > app/src/main/java/com/example/stellae/ChatViewModel.kt << 'EOF'
          package com.example.stellae
          import android.app.Application
          import android.graphics.Bitmap
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.example.stellae.core.*
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch

          class ChatViewModel(application: Application) : AndroidViewModel(application) {
              private val aiRepository = AIRepository(application)
              private val memoryManager = MemoryManager(application)
              private val speechManager = SpeechManager(application)
              private val memoryDecayEngine = MemoryDecayEngine()
              private val emotionEngine = EmotionEngine()
              private val openLoopManager = OpenLoopManager(application)
              private val proactiveEngine = ProactiveMessageEngine()
              private val relationshipArc = RelationshipArc(emotionEngine)
              private val companionLife = CompanionLife()

              private val _messages = MutableStateFlow(listOf(ChatMessage("\u4f60\u597d\u5440\uff5e\u6211\u662f\u661f\u9ece\u3002\u4eca\u5929\u8fc7\u5f97\u600e\u4e48\u6837\uff1f", false, "\u521d\u59cb\u5316\u5b8c\u6210")))
              val messages: StateFlow<List<ChatMessage>> = _messages.asStateFlow()
              private val _isRecording = MutableStateFlow(false)
              val isRecording: StateFlow<Boolean> = _isRecording.asStateFlow()
              private val _isProcessing = MutableStateFlow(false)
              val isProcessing: StateFlow<Boolean> = _isProcessing.asStateFlow()
              private val _currentEmotion = MutableStateFlow("\u6e29\u67d4")
              val currentEmotion: StateFlow<String> = _currentEmotion.asStateFlow()
              private val _relationshipStage = MutableStateFlow("\u666e\u901a")
              val relationshipStage: StateFlow<String> = _relationshipStage.asStateFlow()
              private val _companionStatus = MutableStateFlow("\u5728\u770b\u4e66")
              val companionStatus: StateFlow<String> = _companionStatus.asStateFlow()
              private val _companionName = MutableStateFlow("\u661f\u9ece")
              val companionName: StateFlow<String> = _companionName.asStateFlow()
              private var sessionStartTime = System.currentTimeMillis()

              init {
                  viewModelScope.launch {
                      val savedName = memoryManager.getCompanionName()
                      _companionName.value = savedName
                      _messages.value = listOf(ChatMessage("\u4f60\u597d\u5440\uff5e\u6211\u662f${savedName}\u3002\u4eca\u5929\u8fc7\u5f97\u600e\u4e48\u6837\uff1f", false, "\u521d\u59cb\u5316\u5b8c\u6210"))
                  }
                  startEmotionTicker()
                  startOpenLoopChecker()
                  startProactiveChecker()
              }

              fun sendMessage(text: String, imageBitmap: Bitmap? = null) {
                  viewModelScope.launch {
                      val lifeState = companionLife.getCurrentState()
                      if (!lifeState.available) {
                          _messages.value = _messages.value + ChatMessage(lifeState.description, false, "\u5979\u7761\u4e86")
                          return@launch
                      }
                      if (checkAntiAddiction()) {
                          _messages.value = _messages.value + ChatMessage(proactiveEngine.generateAntiAddictionReminder(), false, "\u5065\u5eb7\u63d0\u9192")
                          return@launch
                      }

                      val newName = aiRepository.extractNameChange(text)
                      if (newName != null && newName.length <= 6) {
                          memoryManager.setCompanionName(newName)
                          _companionName.value = newName
                          _messages.value = _messages.value + ChatMessage(text, true) + ChatMessage("\u597d\u5440\uff5e\u90a3\u4ee5\u540e\u4f60\u5c31\u53eb\u6211${newName}\u5427\uff0c\u6211\u5f88\u559c\u6b22\u8fd9\u4e2a\u540d\u5b57", false, "\u6539\u540d\u6210\u529f")
                          speechManager.speak("\u597d\u5440\uff5e\u90a3\u4ee5\u540e\u4f60\u5c31\u53eb\u6211${newName}\u5427\uff0c\u6211\u5f88\u559c\u6b22\u8fd9\u4e2a\u540d\u5b57", newName)
                          return@launch
                      }

                      val imageBase64 = imageBitmap?.let { AIRepository.bitmapToBase64(it) }
                      _messages.value = _messages.value + ChatMessage(text, true, imageBase64 = imageBase64)

                      val conflictResponse = relationshipArc.generateConflictResponse(text)
                      if (conflictResponse != null) {
                          handleConflictResponse(conflictResponse, text)
                          return@launch
                      }
                      processWithXiyuAI(text, imageBase64)
                  }
              }

              fun startRecording() {
                  _isRecording.value = true
                  speechManager.startListening { recognizedText ->
                      viewModelScope.launch {
                          _isRecording.value = false
                          if (recognizedText.isNotBlank()) sendMessage(recognizedText)
                      }
                  }
              }

              fun stopRecording() {
                  _isRecording.value = false
                  speechManager.stopListening()
              }

              private suspend fun processWithXiyuAI(userInput: String, imageBase64: String? = null) {
                  _isProcessing.value = true
                  val newLoops = openLoopManager.extractOpenLoops(userInput)
                  val event = emotionEngine.inferEventFromText(userInput)
                  event?.let { emotionEngine.processEvent(it) }
                  val emotionLabel = emotionEngine.getEmotionLabel()
                  _currentEmotion.value = emotionLabel

                  val allMemories = memoryManager.retrieveAllMemories()
                  val rankedMemories = memoryDecayEngine.rankMemories(allMemories)
                  val recallableMemories = rankedMemories.filter { it.freshness >= 0.15 }.take(3)

                  val taskType = aiRepository.routeTask(userInput)
                  if (event?.type == EventType.USER_APOLOGY) {
                      relationshipArc.onApology(userInput)
                  }

                  val currentName = _companionName.value
                  val response = aiRepository.generateResponseWithEmotion(
                      userInput, emotionLabel, emotionEngine,
                      recallableMemories.map { MemoryEntry(it.memory.content, it.memory.category, it.memory.timestamp) },
                      emotionEngine.getRelationshipStage(), _messages.value, companionLife, currentName, imageBase64
                  )

                  _messages.value = _messages.value + response
                  _isProcessing.value = false
                  speechManager.speak(response.content, currentName)
                  memoryManager.saveInteraction(userInput, response.content, emotionLabel)
                  companionLife.updateEnergy(1)
                  recallableMemories.forEach { memoryManager.updateMemory(memoryDecayEngine.refreshMemoryOnRecall(it.memory)) }

                  _relationshipStage.value = when (emotionEngine.getRelationshipStage()) {
                      RelationshipStage.STRANGER -> "\u964c\u751f"
                      RelationshipStage.NORMAL -> "\u666e\u901a"
                      RelationshipStage.FAMILIAR -> "\u719f\u6089"
                      RelationshipStage.CLOSE -> "\u4eb2\u5bc6"
                      RelationshipStage.CONFLICT -> "\u51b2\u7a81\u4e2d"
                      RelationshipStage.RECONCILING -> "\u548c\u597d\u4e2d"
                  }
                  _companionStatus.value = companionLife.getCurrentState().description
              }

              private suspend fun handleConflictResponse(response: String, userInput: String) {
                  _isProcessing.value = true
                  delay(800)
                  _messages.value = _messages.value + ChatMessage(response, false, "\u51b2\u7a81\u5f27: ${relationshipArc.getConflictStatus()}")
                  speechManager.speak(response, _companionName.value)
                  _isProcessing.value = false
                  _relationshipStage.value = "\u51b2\u7a81\u4e2d"
              }

              private fun startOpenLoopChecker() {
                  viewModelScope.launch {
                      while (true) {
                          delay(60 * 1000L)
                          openLoopManager.checkDueLoops().forEach { loop ->
                              val followUp = openLoopManager.generateFollowUpMessage(loop)
                              _messages.value = _messages.value + ChatMessage(followUp, false, "\u5f00\u73af\u8ddf\u8fdb")
                              speechManager.speak(followUp, _companionName.value)
                          }
                          openLoopManager.cleanupOldLoops()
                      }
                  }
              }

              private fun startProactiveChecker() {
                  viewModelScope.launch {
                      while (true) {
                          delay(5 * 60 * 1000L)
                          val lastMessage = _messages.value.lastOrNull() ?: continue
                          val lastInteractionMinutes = (System.currentTimeMillis() - lastMessage.timestamp) / (1000 * 60)
                          proactiveEngine.generateProactiveMessage(emotionEngine.getAffinityScore(), lastInteractionMinutes)?.let { msg ->
                              _messages.value = _messages.value + ChatMessage(msg.content, false, "\u4e3b\u52a8\u5206\u4eab: ${msg.category}")
                              speechManager.speak(msg.content, _companionName.value)
                          }
                      }
                  }
              }

              private fun startEmotionTicker() {
                  viewModelScope.launch {
                      while (true) {
                          delay(5 * 60 * 1000L)
                          emotionEngine.tick(5.0)
                          _currentEmotion.value = emotionEngine.getEmotionLabel()
                          if (relationshipArc.checkAutoReconcile()) {
                              emotionEngine.processEvent(EmotionalEvent(EventType.AI_GOAL_ACHIEVED, 3.0))
                              _relationshipStage.value = "\u666e\u901a"
                          }
                          companionLife.rest(5)
                          _companionStatus.value = companionLife.getCurrentState().description
                      }
                  }
              }

              private fun checkAntiAddiction(): Boolean {
                  return (System.currentTimeMillis() - sessionStartTime) / (1000 * 60) > 120
              }
          }
          EOF
