                          else -> drawCircle(color = androidx.compose.ui.graphics.Color(0xFFE57373), radius = 3f, center = androidx.compose.ui.geometry.Offset(cx, cy + 4f))
                      }
                      // 腮红
                      drawCircle(color = androidx.compose.ui.graphics.Color(0x55FF8A80), radius = 8f, center = androidx.compose.ui.geometry.Offset(cx - 34f, cy - 6f))
                      drawCircle(color = androidx.compose.ui.graphics.Color(0x55FF8A80), radius = 8f, center = androidx.compose.ui.geometry.Offset(cx + 34f, cy - 6f))
                      // 动作元素
                      when (action) {
                          "reading" -> {
                              drawRoundRect(color = androidx.compose.ui.graphics.Color(0xFF64B5F6),
                                  topLeft = androidx.compose.ui.geometry.Offset(cx - 55f, cy + 40f), size = androidx.compose.ui.geometry.Size(110f, 50f),
                                  cornerRadius = androidx.compose.ui.geometry.CornerRadius(8f))
                              drawRect(color = Color.White, topLeft = androidx.compose.ui.geometry.Offset(cx - 55f, cy + 40f), size = androidx.compose.ui.geometry.Size(110f, 4f))
                          }
                          "eating" -> {
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFFFFB74D), radius = 16f, center = androidx.compose.ui.geometry.Offset(cx, cy + 42f))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFFE65100), radius = 8f, center = androidx.compose.ui.geometry.Offset(cx, cy + 42f))
                          }
                          "sleeping" -> {
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFFB39DDB), radius = 26f, center = androidx.compose.ui.geometry.Offset(cx - 60f, cy - 40f))
                              drawRect(color = androidx.compose.ui.graphics.Color(0xFF7E57C2),
                                  topLeft = androidx.compose.ui.geometry.Offset(cx - 80f, cy - 46f), size = androidx.compose.ui.geometry.Size(8f, 8f))
                              drawRect(color = androidx.compose.ui.graphics.Color(0xFF7E57C2),
                                  topLeft = androidx.compose.ui.geometry.Offset(cx - 68f, cy - 40f), size = androidx.compose.ui.geometry.Size(8f, 8f))
                          }
                          "walking" -> {
                              drawLine(color = androidx.compose.ui.graphics.Color(0xFF8D6E63),
                                  start = androidx.compose.ui.geometry.Offset(cx - 20f, cy + 60f), end = androidx.compose.ui.geometry.Offset(cx - 30f, cy + 80f),
                                  strokeWidth = 6f)
                              drawLine(color = androidx.compose.ui.graphics.Color(0xFF8D6E63),
                                  start = androidx.compose.ui.geometry.Offset(cx + 20f, cy + 60f), end = androidx.compose.ui.geometry.Offset(cx + 30f, cy + 80f),
                                  strokeWidth = 6f)
                          }
                          "running" -> {
                              // 跑步：双腿摆动 + 身后尘土
                              drawLine(color = androidx.compose.ui.graphics.Color(0xFF8D6E63),
                                  start = androidx.compose.ui.geometry.Offset(cx - 10f, cy + 60f), end = androidx.compose.ui.geometry.Offset(cx - 35f, cy + 82f),
                                  strokeWidth = 7f)
                              drawLine(color = androidx.compose.ui.graphics.Color(0xFF8D6E63),
                                  start = androidx.compose.ui.geometry.Offset(cx + 10f, cy + 60f), end = androidx.compose.ui.geometry.Offset(cx + 35f, cy + 82f),
                                  strokeWidth = 7f)
                              drawCircle(color = androidx.compose.ui.graphics.Color(0x55908090), radius = 6f, center = androidx.compose.ui.geometry.Offset(cx - 50f, cy + 70f))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0x33908090), radius = 5f, center = androidx.compose.ui.geometry.Offset(cx - 60f, cy + 60f))
                          }
                          "singing" -> {
                              // 唱歌：音符
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFFE91E63), radius = 6f, center = androidx.compose.ui.geometry.Offset(cx + 45f, cy - 30f))
                              drawRect(color = androidx.compose.ui.graphics.Color(0xFFE91E63),
                                  topLeft = androidx.compose.ui.geometry.Offset(cx + 51f, cy - 48f), size = androidx.compose.ui.geometry.Size(3f, 20f))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFFF06292), radius = 5f, center = androidx.compose.ui.geometry.Offset(cx + 62f, cy - 22f))
                          }
                          "dancing" -> {
                              // 跳舞：转圈 + 星星
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFFBA68C8), radius = 4f, center = androidx.compose.ui.geometry.Offset(cx - 45f, cy - 20f))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFFBA68C8), radius = 4f, center = androidx.compose.ui.geometry.Offset(cx + 45f, cy - 40f))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFF9575CD), radius = 3f, center = androidx.compose.ui.geometry.Offset(cx - 30f, cy + 55f))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFF9575CD), radius = 3f, center = androidx.compose.ui.geometry.Offset(cx + 30f, cy + 55f))
                          }
                      }
                  }
                  }
                  // 名称标签
                  Surface(
                      shape = RoundedCornerShape(12.dp),
                      color = Color(0xFFEDE7F6),
                      modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 6.dp)
                  ) {
