                  val angerIntensity = emotionEngine.getEmotionIntensity(EmotionEngine.EMOTION_ANGER)
                  return when {
                      isSincereApology && angerIntensity < 3.0 -> ApologyResult.ACCEPTED
                      isSincereApology -> ApologyResult.SOFTENING
                      else -> ApologyResult.REJECTED_NEED_MORE
                  }
              }
              fun generateConflictResponse(userMessage: String): String? {
                  val stage = emotionEngine.getRelationshipStage()
                  if (stage != RelationshipStage.CONFLICT && stage != RelationshipStage.RECONCILING) return null
                  val anger = emotionEngine.getEmotionIntensity(EmotionEngine.EMOTION_ANGER)
                  val sadness = emotionEngine.getEmotionIntensity(EmotionEngine.EMOTION_SADNESS)
                  return when {
                      anger > 6 -> listOf("\u55ef\u3002", "\u54e6\u3002", "\u77e5\u9053\u4e86\u3002", "...").random()
