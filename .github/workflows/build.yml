                              drawRect(color = androidx.compose.ui.graphics.Color(0xFF333333),
                                  topLeft = androidx.compose.ui.geometry.Offset(cx + eyeDX - 10f, eyeY - 6f), size = androidx.compose.ui.geometry.Size(20f, 4f))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFF333333), radius = 5f, center = androidx.compose.ui.geometry.Offset(cx - eyeDX, eyeY))
                              drawCircle(color = androidx.compose.ui.graphics.Color(0xFF333333), radius = 5f, center = androidx.compose.ui.geometry.Offset(cx + eyeDX, eyeY))
