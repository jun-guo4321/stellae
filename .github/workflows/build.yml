          package com.example.stellae.core
          class RelationshipArc(private val emotionEngine: EmotionEngine) {
              private var conflictStartTime: Long? = null
              private var isSincereApology = false
              fun onHurtfulMessage(message: String) {
                  conflictStartTime = System.currentTimeMillis()
                  isSincereApology = false
              }
              fun onApology(message: String): ApologyResult {
                  isSincereApology = checkSincerity(message)
                  val angerIntensity = emotionEngine.getEmotionIntensity(EmotionEngine.EMOTION_ANGER)
                  return when {
                      isSincereApology && angerIntensity < 3.0 -> ApologyResult.ACCEPTED
                      isSincereApology -> ApologyResult.SOFTENING
                      else -> ApologyResult.REJECTED_NEED_MORE
                  }
              }
              fun generateConflictResponse(userMessage: String): String? {
                  val stage = emotionEngine.getRelationshipStage()
                  if (stage != RelationshipStage.CONFLICT && stage != RelationshipStage.RECONCILING) return null
                  val anger = emotionEngine.getEmotionIntensity(EmotionEngine.EMOTION_ANGER)
                  val sadness = emotionEngine.getEmotionIntensity(EmotionEngine.EMOTION_SADNESS)
                  return when {
                      anger > 6 -> listOf("嗯。", "哦。", "知道了。", "...").random()
                      anger > 3 -> listOf("你刚才说的话...让我有点难受", "我需要一点时间", "...", "算了，没事").random()
                      sadness > 5 -> listOf("嗯...", "让我静一静吧", "我有点难过", "...").random()
                      stage == RelationshipStage.RECONCILING -> listOf("...好吧，我原谅你了", "下次别这样了，好吗？", "嗯，我知道你不是故意的", "...抱抱").random()
                      else -> listOf("你认真的吗？", "我不知道该说什么", "...", "嗯").random()
                  }
              }
              fun checkAutoReconcile(): Boolean {
                  val startTime = conflictStartTime ?: return false
                  val elapsedHours = (System.currentTimeMillis() - startTime) / (1000 * 60 * 60)
                  return elapsedHours >= 24
              }
              fun getConflictStatus(): String {
                  val stage = emotionEngine.getRelationshipStage()
                  if (stage != RelationshipStage.CONFLICT && stage != RelationshipStage.RECONCILING) return "关系正常"
                  val elapsedHours = (System.currentTimeMillis() - (conflictStartTime ?: 0)) / (1000 * 60 * 60)
                  return when {
                      elapsedHours < 1 -> "冲突初期"
                      elapsedHours < 6 -> "冲突中"
                      elapsedHours < 24 -> "冷战"
                      else -> "即将自动和好"
                  }
              }
              private fun checkSincerity(message: String): Boolean {
                  val lower = message.lowercase()
                  val sincereMarkers = listOf("对不起", "我错了", "不该", "伤害", "不是故意的", "抱歉")
                  val insincereMarkers = listOf("别生气了", "至于吗", "不就", "行了行了", "好了好了")
                  val sincereCount = sincereMarkers.count { lower.contains(it) }
                  val insincereCount = insincereMarkers.count { lower.contains(it) }
                  return sincereCount > insincereCount && sincereCount >= 1
              }
          }
          enum class ApologyResult { ACCEPTED, SOFTENING, REJECTED_NEED_MORE, REJECTED_INSINCERE }
