              private suspend fun fetchLocation() {
                  try {
                      if (ContextCompat.checkSelfPermission(getApplication(), Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED &&
                          ContextCompat.checkSelfPermission(getApplication(), Manifest.permission.ACCESS_COARSE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                          _messages.value = _messages.value + ChatMessage("⚠️ 需要定位权限才能获取位置，请到设置里授权", false, "定位")
                          return
                      }
                      // 使用系统 LocationManager（不依赖 GMS，国产手机可用）
                      val location = withContext(Dispatchers.IO) {
                          try {
                              // 先取缓存位置
                              val providers = listOf(
                                  android.location.LocationManager.GPS_PROVIDER,
                                  android.location.LocationManager.NETWORK_PROVIDER
                              )
                              var cached: android.location.Location? = null
                              for (p in providers) {
                                  try { cached = locationManager.getLastKnownLocation(p) } catch (e: Exception) {}
                                  if (cached != null) break
                              }
                              cached ?: requestFreshLocation()
                          } catch (e: Exception) { null }
                      }
                      if (location != null) {
                          currentLocation = reverseGeocode(location)
                          aiRepository.currentLocation = currentLocation
                          _messages.value = _messages.value + ChatMessage("📍 已获取位置: ${currentLocation?.city ?: "未知"}", false, "定位更新")
                      } else {
                          _messages.value = _messages.value + ChatMessage("⚠️ 获取位置失败，请检查是否开启 GPS/网络定位后重试", false, "定位")
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                      _messages.value = _messages.value + ChatMessage("⚠️ 定位出错: ${e.message}", false, "定位")
                  }
              }

              // 用单次定位请求主动获取最新位置（等 5 秒）
              // 用单次定位请求主动获取最新位置（同时请求 GPS + 网络，等 10 秒）
              // 持续监听 15 秒，收集所有定位结果，取精度最高（accuracy 最小）的位置
              private suspend fun requestFreshLocation(): android.location.Location? {
                  return withContext(Dispatchers.IO) {
                      val latch = java.util.concurrent.CountDownLatch(1)
                      var best: android.location.Location? = null
                      val listener = object : android.location.LocationListener {
                          override fun onLocationChanged(location: android.location.Location) {
                              // 保留 accuracy 最小的位置（越准）；无 accuracy 的也先记下
                              val cur = best
                              if (cur == null || (location.hasAccuracy() && (!cur.hasAccuracy() || location.accuracy < cur.accuracy))) {
                                  best = location
                              }
                          }
                          override fun onStatusChanged(provider: String?, status: Int, extras: android.os.Bundle?) {}
                          override fun onProviderEnabled(provider: String) {}
                          override fun onProviderDisabled(provider: String) {}
                      }
                      try {
                          val fine = (ContextCompat.checkSelfPermission(getApplication(), Manifest.permission.ACCESS_FINE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED)
                          // 同时监听 GPS 和网络定位，持续 15 秒取最优
                          val providers = mutableListOf<String>()
                          if (fine) providers.add(android.location.LocationManager.GPS_PROVIDER)
                          providers.add(android.location.LocationManager.NETWORK_PROVIDER)
                          var registered = false
                          for (p in providers) {
                              try {
                                  if (locationManager.isProviderEnabled(p)) {
                                      locationManager.requestLocationUpdates(p, 0L, 0f, listener, android.os.Looper.getMainLooper())
                                      registered = true
                                  }
                              } catch (e: Exception) {}
                          }
                          if (registered) {
                              latch.await(15, java.util.concurrent.TimeUnit.SECONDS)
                              // 先释放锁（超时或已被 countDown）
                          } else {
                              latch.countDown()
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          try { locationManager.removeUpdates(listener) } catch (e: Exception) {}
                      }
                      best
                  }
              }
              private suspend fun reverseGeocode(location: Location): LocationInfo? {
                  return withContext(Dispatchers.IO) {
                      val lat = location.latitude
                      val lon = location.longitude
                      val fallback = LocationInfo("位置 ${"%.4f".format(lat)}, ${"%.4f".format(lon)}", "", "坐标定位", lat, lon)
                      try {
                          val url = "https://nominatim.openstreetmap.org/reverse?lat=$lat&lon=$lon&format=json&addressdetails=1"
                          val request = Request.Builder().url(url).header("User-Agent", "StellaeApp").build()
                          val response = httpClient.newCall(request).execute()
                          if (!response.isSuccessful) return@withContext fallback
                          val json = response.body?.string() ?: return@withContext fallback
                          val root = gson.fromJson(json, Map::class.java)
                          val address = root["address"] as? Map<*, *> ?: return@withContext fallback
                          val city = address["city"]?.toString()
                              ?: address["town"]?.toString()
                              ?: address["village"]?.toString()
                              ?: address["county"]?.toString()
                              ?: address["province"]?.toString()
                              ?: address["state"]?.toString()
                              ?: "位置 ${"%.4f".format(lat)}, ${"%.4f".format(lon)}"
                          val district = address["suburb"]?.toString()
                              ?: address["neighbourhood"]?.toString()
                              ?: address["county_district"]?.toString()
                              ?: ""
                          val fullAddress = (address["road"]?.toString() ?: "") + (address["house_number"]?.toString()?.let { " $it" } ?: "")
                          return@withContext LocationInfo(
                              city = city,
                              district = district,
                              address = fullAddress.ifEmpty { "附近" },
                              lat = lat,
                              lon = lon
                          )
                      } catch (e: Exception) {
                          e.printStackTrace()
                          fallback
                      }
                  }
              }

