                      results.distinctBy { it.id }.take(5).map { MemoryEntry(it.content, it.category, it.timestamp) }
                  }
              }

              suspend fun retrieveAllMemories(): List<MemoryEntity> {
                  return withContext(Dispatchers.IO) { dao.getAllMemories() }
              }

              suspend fun updateMemory(memory: MemoryEntity) {
                  withContext(Dispatchers.IO) {
                      dao.delete(memory)
                      dao.insert(memory)
                  }
              }

              private fun extractMemories(input: String, emotion: String): List<MemoryEntity> {
                  val memories = mutableListOf<MemoryEntity>()
                  val lower = input.lowercase()
                  if (emotion in listOf("\u5fc3\u75bc", "\u5173\u5fc3", "\u5b89\u629a")) {
                      memories.add(MemoryEntity(content = "\u7528\u6237\u66fe\u8868\u8fbe\u8fc7\u60c5\u7eea\u56f0\u6270\uff0c\u9700\u8981\u6e29\u67d4\u5bf9\u5f85", category = "emotion", importance = 5))
                  }
                  if (lower.contains("\u559c\u6b22") || lower.contains("\u7231")) {
                      val thing = extractPreference(input)
                      if (thing.isNotEmpty()) memories.add(MemoryEntity(content = "\u7528\u6237\u559c\u6b22: $thing", category = "preference", importance = 3))
                  }
                  if (lower.contains("\u751f\u65e5") || lower.contains("\u8003\u8bd5") || lower.contains("\u9762\u8bd5")) {
                      memories.add(MemoryEntity(content = "\u7528\u6237\u63d0\u53ca: ${input.take(50)}", category = "event", importance = 4))
                  }
                  return memories
              }

              private fun extractKeywords(query: String): List<String> {
                  val stopWords = setOf("\u7684", "\u4e86", "\u662f", "\u6211", "\u4f60", "\u5417", "\u5462", "\u5427", "\u554a", "\u4eca\u5929", "\u660e\u5929")
                  return query.split(" ", "\uff0c", "\u3002", "\uff1f", "\uff01").flatMap { it.toList().map { c -> c.toString() } }.filter { it !in stopWords }.distinct().take(5)
              }

              private fun extractPreference(input: String): String {
                  listOf("\u559c\u6b22(.+?)[\uff0c\u3002]", "\u7231(.+?)[\uff0c\u3002]", "\u6700\u7231(.+?)[\uff0c\u3002]").forEach { pattern ->
                      Regex(pattern).find(input)?.let { return it.groupValues[1] }
                  }
                  return ""
              }
          }

