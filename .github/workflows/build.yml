              // 提取视频首帧画面（用 MediaMetadataRetriever），失败返回 null
              private suspend fun extractVideoFrame(videoPath: String): String? {
                  return withContext(Dispatchers.IO) {
                      try {
                          val retriever = android.media.MediaMetadataRetriever()
                          retriever.setDataSource(getApplication(), android.net.Uri.parse(videoPath))
                          val frame = retriever.getFrameAtTime(0)
                          retriever.release()
                          if (frame != null) AIRepository.bitmapToBase64(frame) else null
                      } catch (e: Exception) {
                          e.printStackTrace()
                          null
                      }
                  }
              }

              // 发送消息
